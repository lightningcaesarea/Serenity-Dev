# Starlight - Alpha's Secret Pool
- type: weightedRandom
  id: Secret
  weights:
    # Serenity: no antag round modes. Only antag-free modes are in the pool, and the default preset leads it so
    # a Secret vote still runs the earnings ledger and calm event scheduler most of the time.
    SerenityAdventure: 0.55
    Extended: 0.25
    Survival: 0.10
    ShitStation: 0.07
    KesslerSyndrome: 0.03


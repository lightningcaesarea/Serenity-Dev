    color: "#ffd27f"
  - type: TokamakFuelRod
    reactants:
      helium3: 100

- type: entity
  id: TokamakFuelRodLithium
  parent: BaseTokamakFuelRod
  name: lithium fuel rod
  components:
  - type: Sprite
    color: "#ff8f8f"
  - type: TokamakFuelRod
    reactants:
      lithium: 100

- type: entity
  id: TokamakFuelRodBoron
  parent: BaseTokamakFuelRod
  name: boron fuel rod
  components:
  - type: Sprite
    color: "#7fffb5"
  - type: TokamakFuelRod
    reactants:
      boron: 100

- type: entity
  id: TokamakFuelRodIron
  parent: BaseTokamakFuelRod
  name: iron fuel rod
  components:
  - type: Sprite
    color: "#b0b0b8"
  - type: TokamakFuelRod
    reactants:
      iron: 100

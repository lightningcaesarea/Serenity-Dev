# Serenity: lets a Spacer pick the icon on their ID card (PDA with the matching card).
- type: loadoutGroup
  id: SpacerIdIcon
  name: loadout-group-spacer-id-icon
  minLimit: 1
  maxLimit: 1
  loadouts:
  - SpacerIdAssistant
  - SpacerIdClericalAssistant
  - SpacerIdCookAssistant
  - SpacerIdDeliveryAssistant
  - SpacerIdGardenerAssistant
  - SpacerIdHandymanAssistant
  - SpacerIdReligiousAssistant
  - SpacerIdShopkeeperAssistant
  - SpacerIdJanitorAssistant
  - SpacerIdMailTech
  - SpacerIdMiningSpecialist
  - SpacerIdSalvageLead
  - SpacerIdRadioHost


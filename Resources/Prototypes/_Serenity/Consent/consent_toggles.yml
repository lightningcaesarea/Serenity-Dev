# Consent flags. Modelled on Floof Station's 8-toggle set plus HardLight's Aphrodisiacs flag.
# Anything that can happen TO a player without their own input defaults to false.

# ---- visibility ----
# No opt-out for seeing explicit text: the server is 18+ and NSFW consent is taken at signup,
# so every player here has already agreed to see it. Toggles cover what happens TO a character.
- type: consentToggle
  id: ShowKinkList
  name: "Publish my kink list"
  description: "Allow others to view your kink preferences when they examine you."
  category: visibility
  default: false

- type: consentToggle
  id: CustomExamineChangedByOthers
  name: "Others may edit my examine text"
  description: "Permit other players to modify your custom examine description."
  category: visibility
  default: false

# ---- interaction ----
- type: consentToggle
  id: LewdInteractions
  name: "Lewd interactions"
  description: "Allow others to initiate adult interactions with your character."
  category: interaction
  default: false

- type: consentToggle
  id: LewdSounds
  name: "Hear lewd sounds"
  description: "Play the sound effects that accompany adult interactions near you."
  category: interaction
  default: false

- type: consentToggle
  id: AutoClimax
  name: "Automatic climax"
  description: "Let your character climax on their own when pleasure peaks, instead of only when you press the button."
  category: interaction
  default: false

- type: consentToggle
  id: LewdContainerFillByOthers
  name: "Container interactions by others"
  description: "Allow other players to initiate milking or filling interactions using containers."

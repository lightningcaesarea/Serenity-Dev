# Stub prototypes for Frontier NF entities referenced by the ported ship maps,
# for which real ported definitions were not practical (missing dependency
# components/prototypes upstream in the same family, or the exact Frontier
# behaviour doesn't map onto anything Serenity has). See frontier_ship_entities.yml
# for the entities that DID get real ports — those IDs have been removed from here.
# Each entry below is a thin alias that inherits a Serenity/SS14 equivalent so ship
# maps still load without errors.

# ── Ship Core ─────────────────────────────────────────────────────────────────

- type: entity
  id: SpawnPointPilot        # 21 files — "Pilot" job prototype doesn't exist in Serenity
  parent: SpawnPointLatejoin
  name: spawn point (pilot)

- type: entity
  id: SpawnPointMercenary    # 4 files — "Mercenary" job prototype doesn't exist in Serenity
  parent: SpawnPointLatejoin
  name: spawn point (mercenary)

# ── Computers / Consoles ─────────────────────────────────────────────────────

- type: entity
  id: ComputerWallmountWithdrawBankATM  # 26 files — needs 3 missing NF base prototypes
  parent: ATM
  name: automated teller machine

# ── Gameplay Items ────────────────────────────────────────────────────────────

- type: entity
  id: MachineCryoSleepPod  # Frontier's CryoSleep component doesn't exist; Serenity uses the
  parent: CryogenicSleepUnit  # Cryostorage-based sleep unit (despawn and store), not the medical CryoPod
  name: cryo sleep pod

- type: entity
  id: LockerPilotFilled    # 3 files — parent LockerPilot doesn't exist in Serenity
  parent: LockerBase
  name: pilot's locker

- type: entity
  id: LockerMercenaryFilled  # 3 files — parent LockerMercenary doesn't exist in Serenity
  parent: LockerBase
  name: mercenary locker

- type: entity
  id: GunSafeShuttleT2Spawner  # 2 files — depends on GunSafeShuttleT2, also not ported
  parent: GunSafePistolMk58
  name: weapon safe

# ── Lighting ─────────────────────────────────────────────────────────────────
# Depend on colored light-tube items (ColoredLightTubeRed etc.) not in Serenity.

- type: entity
  id: PoweredlightColoredRed       # 7 files
  parent: PoweredlightRed

- type: entity
  id: PoweredlightColoredBlack     # 4 files
  parent: PoweredlightBlack

- type: entity
  id: PoweredlightColoredFrostyBlue  # 3 files
  parent: PoweredlightBlue


    - Bartender

- type: entity
  id: chem_master
  parent: [ BaseMachinePowered, ConstructibleMachine ]
  name: ChemMaster 4000
  description: An industrial grade chemical manipulator with pill and bottle production included.
  placement:
    mode: SnapgridCenter
  components:
  - type: SkillRequired # Serenity
    skills: [ Chemistry ]
  - type: Sprite
    sprite: Structures/Machines/mixer.rsi
    snapCardinals: true
    layers:
    - state: mixer_empty
    - state: mixer_screens
      shader: unshaded
      map: ["enum.PowerDeviceVisualLayers.Powered"]
  - type: Icon
    sprite: Structures/Machines/mixer.rsi
    state: mixer_loaded
  - type: ChemMaster
  - type: ChemMasterPackaging
    sections:
    - name: Bottles
      packaging:
      - ChemistryEmptyBottle01
      - ChemistryEmptyBottle02
      - ChemistryEmptyBottle03
      - ChemistryEmptyBottle04
    - name: Pills
      container: PillCanister
      containerPressed: true
      packaging:
      - ChemMasterPill1
      - ChemMasterPill2
      - ChemMasterPill3
      - ChemMasterPill4
      - ChemMasterPill5
      - ChemMasterPill6
      - ChemMasterPill7
      - ChemMasterPill8
      - ChemMasterPill9
      - ChemMasterPill10
      - ChemMasterPill11
      - ChemMasterPill12
      - ChemMasterPill13
      - ChemMasterPill14
      - ChemMasterPill15
      - ChemMasterPill16
      - ChemMasterPill17
      - ChemMasterPill18
      - ChemMasterPill19
      - ChemMasterPill20
    - name: Patches
      container: PatchPack
      containerPressed: true
      packaging:
      - ChemMasterPatchBlank
      - ChemMasterPatchBrute
      - ChemMasterPatchBurn
      - ChemMasterPatchBurnSmall
      - ChemMasterPatchMedical
      - ChemMasterPatchClown
    - name: Pen Injectors
      packaging:
      - PenInjector
      - PenInjectorBrute
      - PenInjectorBurn
      - PenInjectorToxin
      - PenInjectorOxygen
      - PenInjectorRed
      - PenInjectorDrug
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.25,-0.4,0.25,0.4"
        density: 190
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalGlassBreak
      - !type:ChangeConstructionNodeBehavior
        node: machineFrame
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: ActivatableUI
    key: enum.ChemMasterUiKey.Key
  - type: ActivatableUIRequiresPower
  - type: UserInterface
    interfaces:
      enum.ChemMasterUiKey.Key:
        type: ModernChemMasterBui
  - type: ApcPowerReceiver
    powerLoad: 250
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.PowerDeviceVisuals.Powered:
        enum.PowerDeviceVisualLayers.Powered:
          True: { visible: true }
          False: { visible: false }
  - type: WiresPanel
  - type: Machine
    board: ChemMasterMachineCircuitboard
  - type: ContainerContainer
    containers:
      beakerSlot: !type:ContainerSlot
      outputSlot: !type:ContainerSlot
      machine_board: !type:Container
      machine_parts: !type:Container
  - type: ItemSlots
    slots:
      beakerSlot:
        whitelist:
          components:
          - FitsInDispenser
      outputSlot:
        whitelistFailPopup: chem-master-component-cannot-put-entity-message
        whitelist:
          tags:
          - Bottle
          - PillCanister
  - type: SolutionContainerManager
    solutions:
      buffer: {}
      packagingBuffer:
        maxVol: 1000
        canReact: false
  - type: DumpableSolution
    solution: buffer
    unlimited: true
  - type: GuideHelp
    guides:
    - Chemicals
    - Chemist


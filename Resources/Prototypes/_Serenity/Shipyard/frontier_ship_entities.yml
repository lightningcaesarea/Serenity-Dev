# Copyright (c) 2017-2024 New Frontiers. Adapted for Serenity.
# Source: https://github.com/new-frontiers-14/frontier-station-14
#
# Real entity definitions for prototypes referenced by the ported Frontier ship maps,
# replacing the stand-in aliases that used to live in frontier_ship_stubs.yml.
# Component data and balance numbers are kept as upstream wrote them. Where an entity's
# original parent chain referenced a prototype or component Serenity doesn't have
# (mostly other Frontier-only bases), that piece was dropped rather than invented —
# noted inline with "# Serenity:".

# ── Ship Core ─────────────────────────────────────────────────────────────────

- type: entity
  id: WarpPointShip
  parent: WarpPoint
  suffix: ship
  # Serenity: useStationName dropped, WarpPointComponent has no such field here.

- type: entity
  id: SmallThruster
  parent: Thruster
  name: small thruster
  components:
  - type: Thruster
    baseThrust: 33
    thrust: 33
    damage:
      types:
        Heat: 40
  - type: ApcPowerReceiver
    powerLoad: 500
  - type: Sprite
    scale: 0.8, 0.8
    sprite: Structures/Shuttles/thruster.rsi
    layers:
    - state: base
      map: ["enum.ThrusterVisualLayers.Base"]
    - state: thrust
      map: ["enum.ThrusterVisualLayers.ThrustOn"]
      shader: unshaded
      visible: false
    - state: thrust_burn_unshaded
      map: ["enum.ThrusterVisualLayers.ThrustingUnshaded"]
      shader: unshaded
      visible: false
      offset: 0, 1
  - type: StaticPrice
    price: 100

- type: entity
  id: SmallGyroscope
  parent: Gyroscope
  name: small gyroscope
  components:
  - type: Thruster
    thrusterType: Angular
    requireSpace: false
    baseThrust: 250
    thrust: 250
  - type: ApcPowerReceiver
    powerLoad: 200
  - type: Sprite
    scale: 0.8, 0.8
    sprite: Structures/Shuttles/gyroscope.rsi
    snapCardinals: true
    layers:
    - state: base
      map: ["enum.ThrusterVisualLayers.Base"]
    - state: thrust
      map: ["enum.ThrusterVisualLayers.ThrustOn"]
      shader: unshaded
      visible: false
    - state: thrust_burn_unshaded
      map: ["enum.ThrusterVisualLayers.ThrustingUnshaded"]
      shader: unshaded
      visible: false
  - type: StaticPrice
    price: 100

- type: entity
  id: PortableGeneratorPacmanShuttle
  parent: PortableGeneratorPacman
  suffix: Phoron, 5 kW, Ship
  components:
    - type: Transform
      anchored: true
    # Serenity: base declares Dynamic; anchoring on spawn makes it Static at runtime regardless
    # (same as the ship's anchored bench furniture) - declare that explicitly.
    - type: Physics
      bodyType: Static
    - type: MaterialStorage
      storage:
        Plasma: 300
    # Serenity: startOnMapInit dropped (PortableGeneratorComponent has no such field here), and the
    # FuelGenerator.on: true this used to carry never actually took effect - GeneratorSystem forces
    # it back off the moment the entity anchors on spawn, so it always starts off like any other
    # portable generator. Players turn it on after undocking.

- type: entity
  id: PortableGeneratorSuperPacmanShuttle
  parent: PortableGeneratorSuperPacman
  suffix: Uranium, 30 kW, Ship
  components:
    - type: Transform
      anchored: true
    # Serenity: see PortableGeneratorPacmanShuttle above - same anchored-Dynamic-becomes-Static
    # mismatch.
    - type: Physics
      bodyType: Static
    - type: MaterialStorage
      storage:
        Uranium: 1000
    # Serenity: startOnMapInit dropped (no such field), and FuelGenerator.on: true this used to
    # carry never actually took effect - GeneratorSystem forces it back off the moment the entity
    # anchors on spawn. Starts off like any other portable generator; players turn it on.

- type: entity
  name: Atmos Fix Oxygen Marker
  suffix: Shuttle
  id: AtmosFixShuttleOxygenMarker
  description: "Oxygen at lower presure"
  parent: MarkerBase
  components:
    - type: Sprite
      layers:
        - sprite: Markers/atmos.rsi
          state: base
          shader: unshaded
        - sprite: Markers/atmos.rsi
          shader: unshaded
          state: oxygen
    - type: AtmosFixMarker
      mode: 7

- type: entity
  name: Atmos Fix Nitrogen Marker
  suffix: Shuttle
  id: AtmosFixShuttleNitrogenMarker
  description: "Nitrogen at lower presure"
  parent: MarkerBase
  components:
    - type: Sprite
      layers:
        - sprite: Markers/atmos.rsi
          state: base
          shader: unshaded
        - sprite: Markers/atmos.rsi
          shader: unshaded
          state: nitrogen
    - type: AtmosFixMarker
      mode: 8

- type: entity
  name: Atmos Fix Phoron Marker
  suffix: Shuttle
  id: AtmosFixShuttlePlasmaMarker
  description: "Phoron at lower presure"
  parent: MarkerBase
  components:
    - type: Sprite
      layers:
        - sprite: Markers/atmos.rsi
          state: base
          shader: unshaded
        - sprite: Markers/atmos.rsi
          shader: unshaded
          state: plasma
    - type: AtmosFixMarker
      mode: 9


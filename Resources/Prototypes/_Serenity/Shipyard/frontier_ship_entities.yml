# ── Gameplay Items ────────────────────────────────────────────────────────────
# Serenity: dropped the Frontier-only MaterialReclaimerMagnetPickup component;
# the base MaterialReclaimer component/entity is standard SS14.

- type: entity
  parent: [ BaseMachinePowered, ConstructibleMachine ]
  id: MaterialReclaimer
  name: material reclaimer
  description: Cannot reclaim immaterial things, like motivation.
  components:
  - type: Sprite
    sprite: Structures/Machines/material_reclaimer.rsi
    snapCardinals: true
    layers:
    - state: icon
      map: ["enum.LatheVisualLayers.IsRunning"]
    - state: gear-active
      map: ["enum.DamageStateVisualLayers.Base"]
    - state: unlit
      shader: unshaded
      map: ["enum.PowerDeviceVisualLayers.Powered"]
    - state: fill-6
      map: ["enum.SolutionContainerLayers.Fill"]
      visible: false
    - state: panel
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
  - type: Appearance
  - type: SolutionContainerVisuals
    maxFillLevels: 6
    fillBaseName: fill-
  - type: WiresVisuals
  - type: GenericVisualizer
    visuals:
      enum.PowerDeviceVisuals.Powered:
        enum.DamageStateVisualLayers.Base:
          True: { state: gear-active}
          False: { state: gear-idle }
        enum.PowerDeviceVisualLayers.Powered:
          True: { visible: true }
          False: { visible: false }
  - type: LitOnPowered
  - type: PointLight
    radius: 1.5
    energy: 1.6
    enabled: false
    color: "#da824d"
    mask: /Textures/Effects/LightMasks/cone.png
    autoRot: true
    offset: "0, 0.4"
    castShadows: false
  - type: PowerSwitch
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalGlassBreak
      - !type:ChangeConstructionNodeBehavior
        node: machineFrame
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: Machine
    # Serenity: board dropped, MaterialReclaimerMachineCircuitboard doesn't exist here.
  - type: WiresPanel
  - type: MaterialReclaimer
    whitelist:
      components:
      - PhysicalComposition
      - SpaceGarbage
      tags:
      - Trash
      - Recyclable
    blacklist:
      components:
      - Material
      - Pda
      - IdCard
      - Brain
      tags:
      - HighRiskItem
    soundCooldown: 0
    # Serenity: sound dropped, crushing.ogg doesn't exist and MaterialReclaimer.sound is optional.
  - type: MaterialStorage
    insertOnInteract: false
  - type: ContainerContainer
    containers:
      active-material-reclaimer-container: !type:Container
      machine_board: !type:Container
      machine_parts: !type:Container
  - type: SolutionContainerManager
    solutions:
      output:
        maxVol: 1000
  - type: DrainableSolution
    solution: output
  - type: ExaminableSolution
    solution: output
  - type: StaticPrice
    price: 500
  - type: ApcPowerReceiver
    powerLoad: 500

- type: entity
  id: LockerJanitorFilled
  suffix: Filled
  parent: LockerJanitor
  components:
  - type: StorageFill
    contents:
      - id: ClothingBeltJanitorFilled
      - id: ClothingHeadsetService
      - id: MopItem
      - id: BoxMousetrap
      - id: BoxTrashbag
      - id: BoxLightMixed
      - id: Plunger

- type: entity
  parent: GunSafe
  id: GunSafeShuttleCaptain
  name: shuttle safe
  suffix: Empty, Captain
  components:
  - type: AccessReader
    access: [["Captain"]]

# ── Furniture / Benches ──────────────────────────────────────────────────────
# Ported from Frontier's _Park/benches.yml (an upstream community contribution,
# MIT-licensed same as the rest of this commit). Construction-graph linkage
# (crafting a bench in-round) was dropped — these spawn on ship maps only.

- type: entity
  name: sofa
  id: BenchSofaMiddle
  parent: SeatBase
  description: Multiple seats spanning a single object. Truly a marvel of science.
  components:
  - type: Transform
    anchored: true
  - type: Rotatable
  - type: Sprite
    sprite: SimpleStation14/Structures/Furniture/Benches/sofa.rsi
    state: middle
  # Serenity: SeatBase declares bodyType: Dynamic, but anchoring this on spawn makes it Static at
  # runtime regardless — declare that explicitly so the prototype-save test sees a match.
  - type: Physics
    bodyType: Static

- type: entity
  id: BenchSofaLeft
  suffix: Left
  parent: BenchSofaMiddle
  components:
  - type: Sprite
    state: left

- type: entity
  id: BenchSofaRight
  suffix: Right
  parent: BenchSofaMiddle
  components:
  - type: Sprite
    state: right

- type: entity
  name: sofa
  id: BenchSofaCorner
  suffix: Corner
  components:
  - type: Transform
    anchored: true
  - type: Rotatable
  - type: Sprite
    sprite: SimpleStation14/Structures/Furniture/Benches/sofa.rsi
    state: corner
  - type: Clickable
  - type: InteractionOutline
  - type: Physics
    # Serenity: AnchorPrototypeTest requires every anchored entity to declare a Static body; this
    # is also what the anchor system actually leaves it as at runtime.
    bodyType: Static
    # No Fixtures declared, so there is nothing to collide with; the physics system already
    # reports this as non-colliding at runtime, so say so explicitly.
    canCollide: false
  - type: Pullable
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak


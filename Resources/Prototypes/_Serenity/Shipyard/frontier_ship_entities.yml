# ── Suit Storage ─────────────────────────────────────────────────────────────

- type: entity
  id: SuitStorageBasic
  parent: SuitStorageBase
  suffix: Basic Hardsuit
  components:
  - type: StorageFill
    contents:
        - id: AirTankFilled
        - id: ClothingOuterHardsuitSpatio  # Serenity: substitute for the missing ClothingOuterHardsuitBasic
        - id: ClothingMaskBreath

- type: entity
  id: SuitStorageQuartermaster
  parent: SuitStorageBase
  suffix: Quartermaster
  components:
  - type: StorageFill
    contents:
        - id: ClothingShoesBootsMag
        - id: ClothingOuterHardsuitLuxury
        - id: ClothingMaskGasExplorer
  - type: AccessReader

# Wall-mounted suit closet base. Serenity: BaseWallCloset + SuitStorageBase both
# exist as-is, so this ports unmodified from _NF/Entities/Structures/Storage/
# Closets/suit_storage_wall.yml.

- type: entity
  id: SuitStorageWallmount
  parent: [BaseWallCloset, SuitStorageBase]
  name: suit wallstorage unit
  components:
  - type: Sprite
    sprite: _NF/Structures/Storage/suit_storage_wall.rsi
    layers:
    - state: generic
      map: ["enum.StorageVisualLayers.Base"]
    - state: generic_door
      map: ["enum.StorageVisualLayers.Door"]
    - state: locked
      map: ["enum.LockVisualLayers.Lock"]
      shader: unshaded
  - type: EntityStorageVisuals
    stateBaseClosed: generic
    stateDoorOpen: generic_open
    stateDoorClosed: generic_door
    # Serenity: stateBase/stateLocked/stateUnlocked dropped, no such fields here.
  - type: EntityStorage
    closeSound:
      path: /Audio/Machines/windoor_open.ogg
    openSound:
      path: /Audio/Machines/windoor_open.ogg
    # Serenity: denySound dropped, EntityStorageComponent has no such field here.
  - type: Fixtures
    fixtures: {}


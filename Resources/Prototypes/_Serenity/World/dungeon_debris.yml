# Wreck dungeons as worldgen debris. These are the same dungeon configs the station used to place as 16-20
# "wrecks" in a fixed ring (BaseStationShuttles `wrecks`); now the asteroid biome rolls them per chunk.
# Generated by DungeonDebrisSystem when spawned. One entity per config; weights live in the biome table.

- type: entity
  id: BaseDungeonDebris
  parent: BaseDebris
  abstract: true
  name: wreck debris
  components:
  - type: MapGrid
  - type: Gravity
    enabled: true
    inherent: true
  - type: IFF
    flags: HideLabel
    color: "#88b0d1"

- type: entity
  id: DungeonDebrisChunkDebrisSmall
  parent: BaseDungeonDebris
  categories: [ HideSpawnMenu ]
  components:
  - type: DungeonDebris
    config: ChunkDebrisSmall

- type: entity
  id: DungeonDebrisChunkDebris
  parent: BaseDungeonDebris
  categories: [ HideSpawnMenu ]
  components:
  - type: DungeonDebris
    config: ChunkDebris


# Skrell: amphibious humanoids from Baystation12 lore. Ported from RMC-14 (MIT); art is CC-BY-SA-3.0 (see
# Textures/_RMC14/Mobs/Skrells/parts.rsi/meta.json).

- type: body
  id: Skrell
  name: "skrell"
  root: torso
  slots:
    head:
      part: HeadSkrell
      connections:
      - torso
      organs:
        brain: OrganHumanBrain
        eyes: OrganHumanEyes
        tongue: OrganHumanTongue
        eye_implant: null
        nose_implant: null
        brain_implant: null
    torso:
      part: TorsoSkrell
      connections:
      - right arm
      - left arm
      - right leg
      - left leg
      organs:
        heart: OrganHumanHeart
        lungs: OrganHumanLungs
        stomach: OrganHumanStomach
        liver: OrganHumanLiver
        kidneys: OrganHumanKidneys
        cavity: null
    right arm:
      part: RightArmSkrell
      connections:
      - right hand
    left arm:
      part: LeftArmSkrell
      connections:
      - left hand
    right hand:
      part: RightHandSkrell
      organs:
        hand_implant: null
    left hand:
      part: LeftHandSkrell
      organs:
        hand_implant: null
    right leg:
      part: RightLegSkrell
      connections:
      - right foot
    left leg:
      part: LeftLegSkrell
      connections:
      - left foot
    right foot:
      part: RightFootSkrell
    left foot:
      part: LeftFootSkrell

# Body parts reuse the human part behaviour with skrell sprites.

- type: entity
  id: TorsoSkrell
  name: "skrell torso"
  parent: TorsoHuman
  components:
  - type: Sprite
    sprite: _RMC14/Mobs/Skrells/parts.rsi
    state: torso_m

- type: entity
  id: HeadSkrell
  name: "skrell head"

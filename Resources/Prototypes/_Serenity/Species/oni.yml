# Oni: big, horned, strong, and terrible with guns. Species concept from Delta-V / Nyanotrasen; horn, foot
# and ear art is CC-BY-SA-3.0 (see each meta.json). These prototypes and the components behind them are
# Serenity's own implementation.

- type: species
  id: Oni
  name: species-name-oni
  roundStart: true
  prototype: MobOni
  sprites: MobHumanSprites
  markingLimits: MobOniMarkingLimits
  dollPrototype: AppearanceOni
  skinColoration: Hues
  maleFirstNames: NamesOniMale
  femaleFirstNames: NamesOniFemale
  lastNames: NamesOniLast
  naming: FirstLast
  customName: true
  minHeight: 1.0
  defaultHeight: 1.1
  maxHeight: 1.3

- type: markingPoints
  id: MobOniMarkingLimits
  points:
    Special:
      points: 1
      required: false
    Hair:
      points: 1
      required: false
    FacialHair:
      points: 1
      required: false
    Snout:
      points: 1
      required: false
    Tail:
      points: 1
      required: false
    HeadTop:
      points: 1
      required: true
      defaultMarkings: [ OniHornBull ]
    HeadSide:
      points: 1
      required: false
      defaultMarkings: [ PointyEarsUpwards ]
    UndergarmentTop:
      points: 1
      required: false
    UndergarmentBottom:
      points: 1
      required: false
    Chest:
      points: 4
      required: false
    Legs:
      points: 4
      required: false
    Arms:
      points: 4
      required: false

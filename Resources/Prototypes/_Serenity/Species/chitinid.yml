# Chitinids: radiation-hardy insectoid workers. Original species concept and sprites by ElusiveCoin
# (Delta-V, CC-BY-SA-3.0 art); these prototypes are Serenity's own implementation.

- type: species
  id: Chitinid
  name: species-name-chitinid
  roundStart: true
  prototype: MobChitinid
  sprites: MobChitinidSprites
  defaultSkinTone: "#ffda93"
  markingLimits: MobChitinidMarkingLimits
  dollPrototype: AppearanceChitinid
  skinColoration: Hues
  maleFirstNames: NamesChitinidFirstMale
  femaleFirstNames: NamesChitinidFirstFemale
  naming: First
  customName: true

- type: speciesBaseSprites
  id: MobChitinidSprites
  sprites:
    Head: MobChitinidHead
    Snout: MobHumanoidAnyMarking
    UndergarmentTop: MobHumanoidAnyMarking
    Butt: MobHumanoidAnyMarking
    Vagina: MobHumanoidAnyMarking
    Testicles: MobHumanoidAnyMarking
    Penis: MobHumanoidAnyMarking
    Belly: MobHumanoidAnyMarking
    Breasts: MobHumanoidAnyMarking
    UndergarmentBottom: MobHumanoidAnyMarking
    Chest: MobChitinidTorso
    HeadTop: MobHumanoidAnyMarking
    HeadSide: MobHumanoidAnyMarking
    NeckFluff: MobHumanoidAnyMarking
    Tail: MobHumanoidAnyMarking
    Eyes: MobChitinidEyes
    LArm: MobChitinidLArm
    RArm: MobChitinidRArm
    LHand: MobChitinidLHand
    RHand: MobChitinidRHand
    LLeg: MobChitinidLLeg
    RLeg: MobChitinidRLeg
    LFoot: MobChitinidLFoot
    RFoot: MobChitinidRFoot

- type: markingPoints
  id: MobChitinidMarkingLimits
  points:
    Hair:
      points: 0
      required: false
    FacialHair:
      points: 0
      required: false
    Tail:
      points: 1
      required: true
      defaultMarkings: [ ChitinidWingsDefault ]
    HeadTop:
      points: 1
      required: true
      defaultMarkings: [ ChitinidAntennasDefault ]
    Snout:
      points: 1
      required: false
    HeadSide:
      points: 1
      required: false
    NeckFluff:
      points: 1
      required: false
    Head:
      points: 1
      required: false
    UndergarmentTop:
      points: 1
      required: false
    UndergarmentBottom:
      points: 1
      required: false
    Chest:
      points: 1
      required: false
    Arms:
      points: 2
      required: false
    Legs:
      points: 2
      required: false


# Ovinia: sheep-like ruminant humanoids. Species concept and art by juniwoofs and contributors (via Delta-V /
# Den). Art licences differ per file: the body parts, horns and speech bubbles are CC-BY-SA-3.0, while the ear,
# tail, hoof, snout and body markings are CC-BY-NC-SA-3.0 (see each meta.json). These prototypes are
# Serenity's own implementation.

- type: species
  id: Ovinia
  name: species-name-ovinia
  roundStart: true
  prototype: MobOvinia
  sprites: MobOviniaSprites
  defaultSkinTone: "#ffffff"
  markingLimits: MobOviniaMarkingLimits
  dollPrototype: AppearanceOvinia
  skinColoration: Hues
  maleFirstNames: NamesFirstMale
  femaleFirstNames: NamesFirstFemale
  lastNames: NamesLast
  naming: FirstLast
  customName: true
  minHeight: 0.8
  defaultHeight: 0.9
  maxHeight: 1.0

- type: speciesBaseSprites
  id: MobOviniaSprites
  sprites:
    Head: MobOviniaHead
    Snout: MobHumanoidAnyMarking
    UndergarmentTop: MobHumanoidAnyMarking
    Butt: MobHumanoidAnyMarking
    Vagina: MobHumanoidAnyMarking
    Testicles: MobHumanoidAnyMarking
    Penis: MobHumanoidAnyMarking
    Breasts: MobHumanoidAnyMarking
    UndergarmentBottom: MobHumanoidAnyMarking
    Chest: MobOviniaTorso
    HeadTop: MobHumanoidAnyMarking
    HeadSide: MobHumanoidAnyMarking
    NeckFluff: MobHumanoidAnyMarking
    Tail: MobHumanoidAnyMarking
    Eyes: MobHumanoidEyes
    LArm: MobOviniaLArm
    RArm: MobOviniaRArm
    LHand: MobOviniaLHand
    RHand: MobOviniaRHand
    LLeg: MobOviniaLLeg
    RLeg: MobOviniaRLeg
    LFoot: MobOviniaLFoot
    RFoot: MobOviniaRFoot

- type: markingPoints
  id: MobOviniaMarkingLimits
  points:
    Hair:
      points: 1
      required: false
    FacialHair:
      points: 1
      required: false
    Tail:
      points: 1
      required: false
    HeadTop:
      points: 2
      required: true
      defaultMarkings: [ OviniaEars ]
    Snout:
      points: 2
      required: false
    HeadSide:
      points: 1
      required: false
    NeckFluff:
      points: 1
      required: false
    UndergarmentTop:
      points: 1
      required: false
    UndergarmentBottom:
      points: 1
      required: false
    Chest:
      points: 4
      required: false
    Arms:
      points: 4
      required: false
    Legs:
      points: 4
      required: false


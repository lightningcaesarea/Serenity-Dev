# Arachne: human upper body on a spider's body, no shoes. Species concept from Nyanotrasen; spider body art
# is CC-BY-4.0 (kes, Woods) and the clothing displacement and eyes are CC-BY-SA-3.0 (Pofitlo, Rane, from
# Floof Station), see each meta.json. These prototypes are Serenity's own implementation.

- type: species
  id: Arachne
  name: species-name-arachne
  roundStart: true
  prototype: MobArachne
  sprites: MobArachneSprites
  markingLimits: MobArachneMarkingLimits
  dollPrototype: AppearanceArachne
  skinColoration: HumanToned
  maleFirstNames: NamesArachnidFirst
  femaleFirstNames: NamesArachnidFirst
  lastNames: NamesArachnidLast
  naming: FirstLast
  customName: true
  minAge: 60
  youngAge: 150
  oldAge: 400
  maxAge: 666

# LLeg and RLeg are left out on purpose: the spider body is a pre-coloured manual layer on the mob, so the
# skin tone must not tint it, and the human feet are not drawn at all.
- type: speciesBaseSprites
  id: MobArachneSprites
  sprites:
    Tail: MobHumanoidAnyMarking
    Special: MobHumanoidAnyMarking
    Head: MobHumanHead
    Hair: MobHumanoidAnyMarking
    FacialHair: MobHumanoidAnyMarking
    Snout: MobHumanoidAnyMarking
    UndergarmentTop: MobHumanoidAnyMarking
    Butt: MobHumanoidAnyMarking
    Vagina: MobHumanoidAnyMarking
    Testicles: MobHumanoidAnyMarking
    Penis: MobHumanoidAnyMarking
    Belly: MobHumanoidAnyMarking
    Breasts: MobHumanoidAnyMarking
    UndergarmentBottom: MobHumanoidAnyMarking
    Chest: MobHumanTorso
    Eyes: MobArachneEyes
    HeadTop: MobHumanoidAnyMarking
    HeadSide: MobHumanoidAnyMarking
    LArm: MobHumanLArm
    RArm: MobHumanRArm
    LHand: MobHumanLHand
    RHand: MobHumanRHand

- type: humanoidBaseSprite
  id: MobArachneEyes
  baseSprite:
    sprite: _Serenity/Mobs/Species/Arachne/eyes.rsi
    state: eyes

- type: markingPoints
  id: MobArachneMarkingLimits
  points:
    Special:
      points: 1
      required: false
    Hair:
      points: 1
      required: false
    FacialHair:
      points: 1
      required: false
    Snout:
      points: 1
      required: false
    Tail:

# Tuning for surgical sterility. Dirtiness is 0 (sterile) to maxDirtiness on every surgical tool and pair of
# gloves. Each completed surgery step dirties the tools used and the surgeon's gloves; once the operation's total
# dirtiness passes sepsisThreshold each step poisons the patient. Wipe items with soap to clean them.

- type: sterilityConfig
  id: DefaultSterility
  maxDirtiness: 100
  # Dirt one step adds to each surgical tool / to the gloves (a step can override this with surgeryStepDirtiness).
  stepToolDirt: 4
  stepGloveDirt: 4
  # Counted as dirt when the surgeon wears no gloves / no mask.
  missingGlovesDirt: 25
  missingMaskDirt: 10
  # Dirt added per other patient whose DNA is on the tools or gloves.
  crossContaminationDirt: 60
  # Harm per step over the threshold: sepsisBaseDamage + excess^2 / sepsisDamageDivisor, capped at sepsisMaxDamage.
  sepsisThreshold: 40
  sepsisBaseDamage: 1
  sepsisDamageDivisor: 200
  sepsisMaxDamage: 12
  sepsisDamageType: Poison

  # Infection. An operation with total dirtiness above surgeryInfectionThreshold can infect the patient, with
  # chance (dirtiness - threshold) * surgeryInfectionChancePerDirt (at most surgeryInfectionMaxChance), on top of
  # any sepsis damage. An antibiotic prevents new infections and freezes an existing one.
  infectionTickSeconds: 5
  # Seconds a matching narrow-spectrum antibiotic must work to lower the infection by one tier.
  cureSecondsPerTier: 45
  surgeryInfectionThreshold: 30
  surgeryInfectionChancePerDirt: 0.01
  surgeryInfectionMaxChance: 0.9
  # While overdosed on an antibiotic, infections escalate this many times faster (and the antibiotic stops protecting).
  overdoseProgressionMultiplier: 3
  # While overdosed, the chance of a new infection (each dirty-surgery and open-wound roll) is this many times higher.
  # The caps still apply: surgeryInfectionMaxChance for surgery, 100% for open wounds.
  overdoseInfectionChanceMultiplier: 3
  # Untreated open wounds can get infected: each update, a wound at minTier or worse adds chancePerTier * tier.
  openWounds:
    Laceration:
      minTier: 2
      chancePerTier: 0.004
    Puncture:
      minTier: 2
      chancePerTier: 0.005
    Burn:
      minTier: 2
      chancePerTier: 0.003
  # Seconds untreated at tier 1 and 2 before getting worse (the last entry is unused: tier 3 is the worst).
  escalationSeconds: [150, 150, 0]
  # Poison damage per update at tier 1, 2 and 3 (suppressed while an antibiotic is active).
  symptomDamage: [0, 0.25, 0.6]

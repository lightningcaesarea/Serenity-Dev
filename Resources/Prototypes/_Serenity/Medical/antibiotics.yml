# Antibiox is a broad-spectrum antibiotic: it needs no diagnosis and protects against infection, but it does not
# cure one. While it is active it blocks new infections, freezes an existing infection at its current tier and
# suppresses its symptoms. The infection resumes when the drug wears off; draining it in surgery cures it.
# The price is gut dysbiosis: it saps max stamina while it works and for a while after. At 16u or more it overdoses:
# it poisons the patient (painful but not lethal on its own), stops protecting them, makes new infections much likelier
# and makes infections escalate faster.
- type: entity
  parent: MobStatusEffectBase
  id: StatusEffectAntibiotic
  name: antibiotic
  components:
  - type: StatusEffect
    whitelist:
      components:
      - Wound

# Applied while overdosed on an antibiotic: cancels the antibiotic's protection and speeds up infections.
- type: entity
  parent: MobStatusEffectBase
  id: StatusEffectAntibioticOverdose
  name: antibiotic overdose
  components:
  - type: StatusEffect
    whitelist:
      components:
      - Wound

# Stand-in for the gut flora a broad-spectrum drug wipes out. (There is no passive-healing-from-food mechanic
# to switch off, so it lowers max stamina instead.)
- type: entity
  parent: StaminaModifierStatusEffect
  id: StatusEffectDysbiosis
  name: gut dysbiosis
  components:
  - type: StaminaModifierStatusEffect
    modifier: 0.85

- type: reagent
  id: Antibiox
  name: reagent-name-antibiox
  group: Medicine
  desc: reagent-desc-antibiox
  physicalDesc: reagent-physical-desc-powdery
  flavor: bitter
  color: "#c9e6a3"
  metabolisms:
    Bloodstream:
      # Slow to metabolize, so a single 15u dose (an auto-injector) protects for about 7 minutes: it stays in the
      # blood for 15 / 0.05 = 300 s and the antibiotic effect lingers 120 s after the last of it is gone.
      # Metabolizing runs once a second and the effects don't weaken with a lower rate.
      metabolismRate: 0.05
      effects:
      - !type:ModifyStatusEffect
        effectProto: StatusEffectAntibiotic
        time: 120
        type: Update
      # Broad-spectrum drugs wipe out helpful bacteria too; it lingers a while after the drug is gone
      - !type:ModifyStatusEffect
        effectProto: StatusEffectDysbiosis
        time: 240
        type: Update
      # Overdose (16u): poisons the patient, and the drug stops protecting against infection and instead speeds it up.
      # It should hurt, not kill: two auto-injectors (30u) stay overdosed while 30u -> 16u, (30 - 16) / 0.05 + 1 = 281
      # metabolism ticks, so 0.21 Poison a tick comes to about 59 Poison in all, spread over ~4.7 minutes.
      - !type:HealthChange
        conditions:
        - !type:ReagentCondition
          reagent: Antibiox
          min: 16
        damage:
          types:
            Poison: 0.21
      - !type:ModifyStatusEffect
        conditions:
        - !type:ReagentCondition
          reagent: Antibiox
          min: 16
        effectProto: StatusEffectAntibioticOverdose
        time: 10
        type: Update

# Antibiox takes two steps: sulfur and ethanol make an inert sulfa solution, which then needs dylovene and a pinch of
# diethylamine (itself mixed from ammonia and ethanol, and ammonia needs heating) to become the drug.
- type: reagent
  id: SulfaSolution
  name: reagent-name-sulfa-solution
  group: Medicine
  desc: reagent-desc-sulfa-solution
  physicalDesc: reagent-physical-desc-cloudy
  flavor: bitter
  color: "#e3dc8f"

- type: reaction
  id: SulfaSolution
  reactants:
    Sulfur:
      amount: 1
    Ethanol:
      amount: 1
  products:
    SulfaSolution: 2

- type: reaction
  id: Antibiox
  reactants:
    Dylovene:
      amount: 1
    SulfaSolution:
      amount: 2
    Diethylamine:
      amount: 1
  products:
    Antibiox: 3

- type: entity
  parent: ChemicalMedipen
  id: AntibioxAutoInjector
  name: antibiox auto-injector
  description: A single-dose, non-refillable medipen containing antibiox, a broad-spectrum antibiotic. It holds an infection at bay but does not cure it, and leaves the patient's gut flora depleted for a while.
  components:
  - type: Item
    inhandVisuals:
      left:
      - state: base-needle-inhand-left
      - state: base-colorA-inhand-left
        color: "#3b7d3a"
      - state: base-colorB-inhand-left
      right:
      - state: base-needle-inhand-right
      - state: base-colorA-inhand-right
        color: "#3b7d3a"
      - state: base-colorB-inhand-right
  - type: Sprite
    sprite: _Serenity/Objects/Specific/Medical/antibiox_injector.rsi
    layers:
    - state: antibiox
      map: ["enum.SolutionContainerLayers.Fill"]
  - type: SolutionContainerVisuals
    maxFillLevels: 1
    changeColor: false
    emptySpriteName: antibiox_empty
  - type: Solution
    solution:
      maxVol: 15 # one dose; the base medipen holds 20
      reagents:
      - ReagentId: Antibiox
        Quantity: 15

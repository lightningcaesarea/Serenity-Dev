# Flatpacks of the pathogen machines (see pathogens.yml), so a pathology lab can be set up anywhere.

- type: entity
  parent: BaseFlatpack
  id: BloodCultureAnalyzerFlatpack
  name: blood culture analyzer flatpack
  description: A flatpack used for constructing a blood culture analyzer.
  components:
  - type: Flatpack
    entity: DiseaseDiagnoser
  - type: Sprite
    layers:
    - state: base
    - state: overlay
      color: "#52B4E9"
      map: ["enum.FlatpackVisualLayers.Overlay"]
    - state: icon-default

- type: entity
  parent: BaseFlatpack
  id: AntibioticSynthesizerFlatpack
  name: antibiotic synthesizer flatpack
  description: A flatpack used for constructing an antibiotic synthesizer.
  components:
  - type: Flatpack
    entity: Vaccinator
  - type: Sprite
    layers:
    - state: base
    - state: overlay
      color: "#52B4E9"
      map: ["enum.FlatpackVisualLayers.Overlay"]
    - state: icon-default

- type: entity
  id: LockerPathology
  parent: LockerBase
  name: pathology locker
  description: "Holds the equipment for a pathology lab: flatpacked machines for finding out which bacteria is making someone sick."
  components:
  - type: Appearance
  - type: EntityStorageVisuals
    stateBaseClosed: med
    stateDoorOpen: med_open
    stateDoorClosed: med_door
  - type: AccessReader
    access: [ [ "Medical" ] ]

# Bottles of the two Antibiox inputs Chemistry makes, so a pathology lab can mix its own.
- type: entity
  id: ChemistryBottleAmmonia
  suffix: ammonia
  parent: BaseChemistryBottleFilled
  components:
  - type: Label
    currentLabel: reagent-name-ammonia
  - type: Solution
    solution:
      reagents:
      - ReagentId: Ammonia
        Quantity: 30

- type: entity
  id: ChemistryBottleDiethylamine
  suffix: diethylamine
  parent: BaseChemistryBottleFilled
  components:
  - type: Label
    currentLabel: reagent-name-diethylamine
  - type: Solution
    solution:
      reagents:
      - ReagentId: Diethylamine
        Quantity: 30

# A pouch of three Antibiox auto-injectors.
- type: entity
  id: PenPackAntibiox
  parent: PenPackMedical
  name: antibiox auto-injector pouch
  suffix: Filled
  description: A pouch holding a few antibiox auto-injectors, for holding an infection at bay until it can be treated.
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase:
        id: AntibioxAutoInjector
        amount: 3

- type: entityTable
  id: LockerFillPathology
  table: !type:AllSelector
    children:
    - id: BloodCultureAnalyzerFlatpack
    - id: AntibioticSynthesizerFlatpack
    - id: BoxSyringe
    - id: BoxBeaker
    - id: Paper
      amount: 4
    - id: Pen
    - id: ClothingHandsGlovesLatex
    - id: ClothingMaskSterile
    - id: ClothingOuterBioVirology
    - id: ClothingHeadHatHoodBioVirology
    - id: ChemistryBottleDylovene
    - id: ChemistryBottleSulfur
    - id: ChemistryBottleEthanol
    - id: ChemistryBottleAmmonia
    - id: ChemistryBottleDiethylamine
    - id: PenPackAntibiox

- type: entity
  id: LockerPathologyFilled
  parent: LockerPathology
  suffix: Filled
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:NestedSelector
        tableId: LockerFillPathology

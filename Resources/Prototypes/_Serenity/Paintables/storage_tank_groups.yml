# Looks the spray painter can give the generic storage tanks, one group per tank size so the
# fill always matches. Each style entity needs PaintableTankVisuals and SolutionContainerVisuals.
- type: paintableGroup
  id: StorageTanks
  cost: 2
  defaultStyle: generic
  styles:
    generic: GenericTank
    blue: GenericTankBlue
    white: GenericTankWhite
    yellow: GenericTankYellow
    green: GenericTankGreen
    orange: GenericTankOrange
    cyan: GenericTankCyan
    pink: GenericTankPink
    purple: GenericTankPurple
    red: GenericTankRed
    dark-green: GenericTankDarkGreen
    brown: GenericTankBrown
    black: GenericTankBlack
    light-blue: GenericTankLightBlue
    water: WaterTank
    fuel: WeldingFuelTank
    fuel-style-generic: GenericTankFuelStyle
    fuel-style-blue: GenericTankFuelStyleBlue
    fuel-style-white: GenericTankFuelStyleWhite
    fuel-style-yellow: GenericTankFuelStyleYellow
    fuel-style-green: GenericTankFuelStyleGreen
    fuel-style-orange: GenericTankFuelStyleOrange
    fuel-style-cyan: GenericTankFuelStyleCyan
    fuel-style-pink: GenericTankFuelStylePink
    fuel-style-purple: GenericTankFuelStylePurple
    fuel-style-red: GenericTankFuelStyleRed
    fuel-style-dark-green: GenericTankFuelStyleDarkGreen
    fuel-style-brown: GenericTankFuelStyleBrown
    fuel-style-black: GenericTankFuelStyleBlack
    fuel-style-light-blue: GenericTankFuelStyleLightBlue

- type: paintableGroup
  id: StorageTanksHighCapacity
  cost: 2
  defaultStyle: generic
  styles:
    generic: GenericTankHighCapacity
    blue: GenericTankHighCapacityBlue
    white: GenericTankHighCapacityWhite
    yellow: GenericTankHighCapacityYellow
    green: GenericTankHighCapacityGreen
    orange: GenericTankHighCapacityOrange
    cyan: GenericTankHighCapacityCyan
    pink: GenericTankHighCapacityPink
    purple: GenericTankHighCapacityPurple
    red: GenericTankHighCapacityRed
    dark-green: GenericTankHighCapacityDarkGreen
    brown: GenericTankHighCapacityBrown
    black: GenericTankHighCapacityBlack
    light-blue: GenericTankHighCapacityLightBlue
    water: WaterTankHighCapacity
    fuel: WeldingFuelTankHighCapacity

- type: paintableGroupCategory
  id: StorageTanks
  groups:
  - StorageTanks
  - StorageTanksHighCapacity

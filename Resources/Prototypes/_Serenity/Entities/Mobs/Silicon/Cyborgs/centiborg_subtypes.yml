# Centiborg chassis: a long, many-legged cosmetic frame for each borg module type.
# Sprites are CC-BY-SA-3.0 by Toriate; see each .rsi/meta.json and centiborg_credit_by_toriate.txt.
# The layers, mind-light and toggle-light states all come from BorgSubtypeBase (borg, borg_e, borg_l);
# the module bases supply parentType and the menu preview.

- type: entity
  abstract: true
  id: BorgCentiborgSubtypeBase
  components:
    - type: BorgSubtypeDefinition
      # The art is 64x64 with the feet on the bottom edge: raise it half a tile so it stands on its
      # tile like a 32x32 chassis.
      offset: 0, 0.5
      inventoryTemplateId: borgDutch

- type: entity
  parent: [ BorgGenericSubtypeBase, BorgCentiborgSubtypeBase ]
  id: BorgGenericSubtypeCentiborg
  name: Centiborg
  components:
    - type: BorgSubtypeDefinition
      spritePath: _Serenity/Mobs/Silicon/Borg/Centiborg/centiborg_generic.rsi


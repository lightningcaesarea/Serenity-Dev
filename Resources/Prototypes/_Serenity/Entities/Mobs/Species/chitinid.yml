- type: entity
  save: false
  name: Urist McChitin
  parent: [BaseMobSpeciesOrganic, BaseSpeciesPickupableLarge, BaseInventoryMoth]
  id: BaseMobChitinid
  abstract: true
  components:
  - type: HumanoidAppearance
    species: Chitinid
    hideLayersOnEquip:
    - HeadTop
  - type: Hunger
  - type: Thirst
  - type: Icon
    sprite: _Serenity/Mobs/Species/Chitinid/parts.rsi
    state: full
  - type: Body
    prototype: Chitinid
    requiredLegs: 2
  - type: Damageable
    damageContainer: Biological
    damageModifierSet: Chitinid
  - type: Speech
    speechVerb: Chitinid
    speechSounds: UnisexMoth
    allowedEmotes: ['Chitter', 'Click']
  - type: TypingIndicator
    proto: moth
  - type: Butcherable
    spawned:
    - id: FoodMeat
      amount: 5
  - type: Bloodstream
    bloodReferenceSolution:
      reagents:
      - ReagentId: InsectBlood
        Quantity: 600
  - type: DamageVisuals
    damageOverlayGroups:
      Brute:
        sprite: Mobs/Effects/brute_damage.rsi
        color: "#808A51"
      Burn:
        sprite: Mobs/Effects/burn_damage.rsi
  - type: Vocal
    sounds:
      Male: UnisexChitinid
      Female: UnisexChitinid
      Unsexed: UnisexChitinid
  - type: BodyEmotes
    soundsId: MothBodyEmotes
  # Cold-blooded: chilly air hurts and slows them down hard.
  - type: Temperature
    currentTemperature: 310.15
    specificHeat: 46
  - type: TemperatureDamage
    heatDamageThreshold: 320
    coldDamageThreshold: 230
    coldDamage:
      types:
        Cold: 1.25
    heatDamage:
      types:
        Heat: 1.0
  - type: TemperatureSpeed
    thresholds:
      289: 0.6
      275: 0.4
      250: 0.3
  # Soaks up radiation until full, then coughs it up as a chitzite.
  - type: RadiationStore
    purgeAction: ActionPurgeChitzite
    purgeItem: Chitzite
    purgeSound:
      collection: MaleCoughs
    fullPopup: chitinid-radiation-full
    purgePopup: chitinid-radiation-purge
  # Thick chitin turns away needles and hyposprays.
  - type: InjectionProof
  # Extra limbs let them drag things without a free hand.
  - type: Puller
    needsHands: false
  # Bioluminescent glow, toggled like an unpowered flashlight.
  - type: UnpoweredFlashlight
  - type: PointLight
    enabled: false
    radius: 3
    softness: 5
    color: "#2CFA1F"
    autoRot: true
  - type: Sprite # repeated to put the wings (Tail) between the back items and the clothing, as for moths
    noRot: true
    drawdepth: Mobs
    layers:
      - map: [ "enum.HumanoidVisualLayers.Chest" ]
      - map: [ "enum.HumanoidVisualLayers.Head" ]
      - map: [ "enum.HumanoidVisualLayers.Snout" ]
      - map: [ "enum.HumanoidVisualLayers.Eyes" ]
      - map: [ "enum.HumanoidVisualLayers.RArm" ]
      - map: [ "enum.HumanoidVisualLayers.LArm" ]
      - map: [ "enum.HumanoidVisualLayers.RLeg" ]
      - map: [ "enum.HumanoidVisualLayers.LLeg" ]
      - map: [ "enum.HumanoidVisualLayers.Butt" ]
      - map: [ "enum.HumanoidVisualLayers.Vagina" ]
      - map: [ "enum.HumanoidVisualLayers.Testicles" ]
      - map: [ "enum.HumanoidVisualLayers.Penis" ]
      - map: [ "enum.HumanoidVisualLayers.Belly" ]
      - map: [ "enum.HumanoidVisualLayers.Breasts" ]
      - map: [ "enum.HumanoidVisualLayers.UndergarmentBottom" ]
      - map: [ "enum.HumanoidVisualLayers.UndergarmentTop" ]
      - map: [ "jumpsuit" ]
      - map: [ "enum.HumanoidVisualLayers.LHand" ]
      - map: [ "enum.HumanoidVisualLayers.RHand" ]
      - map: [ "enum.HumanoidVisualLayers.LFoot" ]
      - map: [ "enum.HumanoidVisualLayers.RFoot" ]
      - map: [ "enum.HumanoidVisualLayers.Handcuffs" ]
        color: "#ffffff"
        sprite: Objects/Misc/handcuffs.rsi
        state: body-overlay-2
        visible: false
      - map: [ "gloves" ]
      - map: [ "shoes" ]
      - map: [ "ears" ]
      - map: [ "eyes" ]
      - map: [ "outerClothing" ]
      - map: [ "belt" ]
      - map: [ "id" ]
      - map: [ "enum.HumanoidVisualLayers.Tail" ]
      - map: [ "back" ]
      - map: [ "enum.HumanoidVisualLayers.NeckFluff" ]
      - map: [ "neck" ]
      - map: [ "misc" ]
      - map: [ "enum.HumanoidVisualLayers.SnoutCover" ]
      - map: [ "enum.HumanoidVisualLayers.FacialHair" ]
      - map: [ "enum.HumanoidVisualLayers.Hair" ]
      - map: [ "enum.HumanoidVisualLayers.HeadSide" ]
      - map: [ "enum.HumanoidVisualLayers.HeadTop" ]
      - map: [ "mask" ]
      - map: [ "head" ]
      - map: [ "pocket1" ]
      - map: [ "pocket2" ]
      - map: [ "clownedon" ] # Dynamically generated
        sprite: "Effects/creampie.rsi"
        state: "creampie_moth"
        visible: false

- type: entity
  save: false
  name: Urist McChitin
  parent: BaseMobChitinid
  id: MobChitinid

- type: entity
  parent: [BaseSpeciesDummy, BaseInventoryMoth]
  id: AppearanceChitinid
  categories: [ HideSpawnMenu ]
  description: A dummy chitinid meant to be used in character setup.
  components:
  - type: HumanoidAppearance
    species: Chitinid
    hideLayersOnEquip:
    - HeadTop

- type: damageModifierSet
  id: Chitinid
  coefficients:
    Blunt: 0.9
    Piercing: 0.9
    Slash: 0.9
    Cold: 1.1
    Shock: 1.15
    Radiation: 0.2

- type: speechVerb
  id: Chitinid
  name: chat-speech-verb-name-chitinid
  speechVerbStrings:
  - chat-speech-verb-chitinid-1
  - chat-speech-verb-chitinid-2
  - chat-speech-verb-chitinid-3

- type: emoteSounds
  id: UnisexChitinid
  params:
    variation: 0.125
  sounds:
    Scream:
      path: /Audio/Voice/Moth/moth_scream.ogg
    Laugh:
      path: /Audio/Voice/Moth/moth_laugh.ogg
    Chitter:
      path: /Audio/Voice/Moth/moth_chitter.ogg
    Squeak:
      path: /Audio/Voice/Moth/moth_squeak.ogg
    Click:
      path: /Audio/Voice/Arachnid/arachnid_click.ogg
    Weh:
      collection: Weh
    Hew:
      collection: Hew

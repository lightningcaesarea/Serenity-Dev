# Serenity: Spacer ID card/PDA variants, picked in character setup via the SpacerIdIcon loadout group.
# Only the glyph on the card changes; access, job and HUD icon stay Assistant.

- type: entity
  parent: AssistantIDCard
  id: SpacerIdCardClericalAssistant
  name: clerical assistant ID card
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    layers:
    - sprite: _Serenity/Objects/Misc/id_card_bases.rsi
      state: default
    - sprite: _Serenity/Objects/Misc/spacer_id_icons.rsi
      state: idclericalassistant

- type: entity
  parent: AssistantPDA
  id: SpacerPdaClericalAssistant
  name: spacer PDA
  categories: [ HideSpawnMenu ]
  components:
  - type: Pda
    id: SpacerIdCardClericalAssistant


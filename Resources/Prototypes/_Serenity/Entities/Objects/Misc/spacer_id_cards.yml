# Serenity: Spacer ID card/PDA variants, picked in character setup via the SpacerIdIcon loadout group.
# Only the glyph on the card changes; access, job and HUD icon stay Assistant.

- type: entity
  parent: AssistantIDCard
  id: SpacerIdCardTechnicalAssistant
  name: technical assistant ID card
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _Goobstation/Objects/Misc/id_cards.rsi
    layers:
    - state: default
    - sprite: _Serenity/Objects/Misc/spacer_id_icons.rsi
      state: idtechnicalassistant

- type: entity
  parent: AssistantPDA
  id: SpacerPdaTechnicalAssistant
  name: spacer PDA
  categories: [ HideSpawnMenu ]
  components:
  - type: Pda
    id: SpacerIdCardTechnicalAssistant


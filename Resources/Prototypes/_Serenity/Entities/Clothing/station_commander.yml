  - type: Clothing
    sprite: _Serenity/Clothing/Neck/Mantles/station_commander.rsi

# ── Outer clothing ───────────────────────────────────────────────────────────

# Same protection as the captain's carapace, in the Commander's colors.
- type: entity
  parent: ClothingOuterArmorCaptainCarapace
  id: ClothingOuterArmorStationCommanderCarapace
  name: Station Commander carapace
  description: An armored chestpiece that protects without slowing the Station Commander down.
  components:
  - type: Sprite
    sprite: _Serenity/Clothing/OuterClothing/Armor/station_commander_carapace.rsi
  - type: Clothing
    sprite: _Serenity/Clothing/OuterClothing/Armor/station_commander_carapace.rsi

- type: entity
  parent: ClothingOuterStorageBase
  id: ClothingOuterJacketStationCommander
  name: Station Commander jacket
  description: A green dress jacket with gold epaulets, the top half of the Station Commander's uniform.
  components:
  - type: Sprite
    sprite: _Serenity/Clothing/OuterClothing/Misc/station_commander_jacket.rsi
  - type: Clothing
    sprite: _Serenity/Clothing/OuterClothing/Misc/station_commander_jacket.rsi

- type: entity
  parent: ClothingOuterEVASuitBase
  id: ClothingOuterEVASuitStationCommander
  name: Station Commander EVA suit
  description: A green and gold EVA suit with a built-in helmet, issued to the Station Commander.
  components:
  # Serenity: the ToggleableClothing below needs a matching container declared up front.
  - type: ContainerContainer
    containers:
      toggleable-clothing: !type:ContainerSlot {}
  - type: Sprite
    sprite: _Serenity/Clothing/OuterClothing/Suits/eva_color.rsi
    layers:
    - state: icon-base
      color: "#194214"
    - state: icon-decals-01
      color: "#f2b833"
    - state: icon-reinforced-points
      color: "#3e3e48"
    - state: icon-breathing-gear
    - state: icon-unshaded
      shader: unshaded
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left-base
        color: "#194214"
      - state: inhand-left-decals-01
        color: "#f2b833"
      - state: inhand-left-reinforced-points
        color: "#3e3e48"
      - state: inhand-left-breathing-gear
      - state: inhand-left-unshaded
        shader: unshaded
      right:
      - state: inhand-right-base
        color: "#194214"
      - state: inhand-right-decals-01
        color: "#f2b833"
      - state: inhand-right-reinforced-points
        color: "#3e3e48"
      - state: inhand-right-breathing-gear
      - state: inhand-right-unshaded
        shader: unshaded
  - type: Clothing
    sprite: _Serenity/Clothing/OuterClothing/Suits/eva_color.rsi
    clothingVisuals:
      outerClothing:
      - state: equipped-base
        color: "#194214"
      - state: equipped-decals-01
        color: "#f2b833"
      - state: equipped-reinforced-points
        color: "#3e3e48"
      - state: equipped-breathing-gear
      - state: equipped-unshaded
        shader: unshaded
  - type: ToggleableClothing
    clothingPrototype: ClothingHeadEVAHelmetStationCommander

- type: entity
  parent: ClothingHeadEVAHelmetBase
  id: ClothingHeadEVAHelmetStationCommander
  name: Station Commander EVA helmet
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _Serenity/Clothing/Head/Helmets/eva_color.rsi
    layers:
    - state: icon-base
      color: "#194214"
    - state: icon-reinforced-points
      color: "#3e3e48"
    - state: icon-decals-02
      color: "#f2b833"
    - state: icon-visor
      color: "#fbe6b8"
  - type: Clothing
    sprite: _Serenity/Clothing/Head/Helmets/eva_color.rsi
    clothingVisuals:
      head:
      - state: equipped-head-base
        color: "#194214"
      - state: equipped-head-reinforced-points
        color: "#3e3e48"
      - state: equipped-head-decals-02
        color: "#f2b833"
      - state: equipped-head-visor
        color: "#fbe6b8"


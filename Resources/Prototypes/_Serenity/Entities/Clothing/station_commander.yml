# Station Commander clothing (the reworked Head of Personnel).
# Sprites are Frontier Station 14's station representative set; see each meta.json for
# license and credit. The beret, cap and jacket are CC-BY-NC-SA-4.0, the rest CC-BY-SA-3.0.
# The prototypes below are written for Serenity, not copied from Frontier.

# ── Uniforms ─────────────────────────────────────────────────────────────────

- type: entity
  parent: ClothingUniformJumpsuitHoP
  id: ClothingUniformJumpsuitStationCommander
  name: Station Commander uniform
  description: A finely tailored uniform for the Station Commander. Every stitch says "I am in charge here."
  components:
  - type: Sprite
    sprite: _Serenity/Clothing/Uniforms/Jumpsuit/station_commander.rsi
  - type: Clothing
    sprite: _Serenity/Clothing/Uniforms/Jumpsuit/station_commander.rsi

- type: entity
  parent: ClothingUniformJumpskirtHoP
  id: ClothingUniformJumpskirtStationCommander
  name: Station Commander uniform skirt
  description: A finely tailored uniform skirt for the Station Commander.
  components:
  - type: Sprite
    sprite: _Serenity/Clothing/Uniforms/Jumpskirt/station_commander.rsi
  - type: Clothing
    sprite: _Serenity/Clothing/Uniforms/Jumpskirt/station_commander.rsi

- type: entity
  parent: ClothingUniformJumpsuitHoP
  id: ClothingUniformJumpsuitMilitaryStationCommander
  name: Station Commander military jumpsuit
  description: A sturdy military-cut jumpsuit with gold epaulets, for a Station Commander expecting trouble.
  components:
  - type: Sprite
    sprite: _Serenity/Clothing/Uniforms/Jumpsuit/military_color.rsi
    layers:
    - state: icon-base-bottom
      color: "#3e3e48"
    - state: icon-base-top-jumpsuit
      color: "#3e3e48"
    - state: icon-decor-department
      color: "#09300b"
    - state: icon-decor-department-head
      color: "#fbe6b8"
    - state: icon-decor-epaulets
      color: "#eca615"
    - state: icon-belt
      color: "#fbe6b8"
    - state: icon-belt-buckle
      color: "#eca615"
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left-base-bottom
        color: "#3e3e48"
      - state: inhand-left-base-top-jumpsuit
        color: "#3e3e48"
      - state: inhand-left-decor-department
        color: "#09300b"
      - state: inhand-left-decor-department-head
        color: "#fbe6b8"
      - state: inhand-left-decor-epaulets
        color: "#eca615"
      - state: inhand-left-belt
        color: "#fbe6b8"
      - state: inhand-left-belt-buckle
        color: "#eca615"
      right:
      - state: inhand-right-base-bottom
        color: "#3e3e48"
      - state: inhand-right-base-top-jumpsuit
        color: "#3e3e48"
      - state: inhand-right-decor-department
        color: "#09300b"
      - state: inhand-right-decor-department-head
        color: "#fbe6b8"
      - state: inhand-right-decor-epaulets
        color: "#eca615"
      - state: inhand-right-belt
        color: "#fbe6b8"
      - state: inhand-right-belt-buckle
        color: "#eca615"
  - type: Clothing
    sprite: _Serenity/Clothing/Uniforms/Jumpsuit/military_color.rsi
    clothingVisuals:
      jumpsuit:
      - state: equipped-base-bottom
        color: "#3e3e48"
      - state: equipped-base-top-jumpsuit
        color: "#3e3e48"
      - state: equipped-decor-department
        color: "#2c6a30"
      - state: equipped-decor-department-head
        color: "#fbe6b8"
      - state: equipped-decor-epaulets
        color: "#eca615"
      - state: equipped-belt
        color: "#fbe6b8"
      - state: equipped-belt-buckle
        color: "#eca615"

# ── Head ─────────────────────────────────────────────────────────────────────

- type: entity

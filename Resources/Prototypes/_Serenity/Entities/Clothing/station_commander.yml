  - type: Clothing
    sprite: _Serenity/Clothing/Head/Hats/station_commander_beret.rsi

- type: entity
  parent: ClothingHeadHatHopcap
  id: ClothingHeadHatStationCommanderCap
  name: Station Commander cap
  description: A peaked cap issued to the Station Commander. Try not to lose it.
  components:
  - type: Sprite
    sprite: _Serenity/Clothing/Head/Hats/station_commander_cap.rsi
  - type: Clothing
    sprite: _Serenity/Clothing/Head/Hats/station_commander_cap.rsi


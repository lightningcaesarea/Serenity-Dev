# Stirling Synthetics clothing line
# Sprites: CC-BY-SA-3.0, originally from tgstation/Baystation12/CEV-Eris, resprited by AjexRose/erhardsteinhauer/RustyRed for New Frontiers 14
# Ported from New Frontiers 14 (MIT commit 5be37d18c2 + AGPL era, design reference only for post-MIT items)

# ── Uniforms ────────────────────────────────────────────────────────────────

- type: entity
  id: ClothingUniformJumpsuitStirling
  parent: ClothingUniformBase
  name: Stirling jumpsuit
  description: A jumpsuit produced by Stirling Synthetics. Designed to reduce chaffing between the legs for the comfort of skin, slime, scales, fluff, and wood.
  components:
  - type: Sprite
    sprite: _Serenity/Clothing/Uniforms/Jumpsuit/arcadia.rsi
    state: icon
  - type: Clothing
    sprite: _Serenity/Clothing/Uniforms/Jumpsuit/arcadia.rsi

- type: entity
  id: ClothingUniformJumpskirtStirling
  parent: ClothingUniformSkirtBase
  name: Stirling jumpskirt
  description: A jumpskirt produced by Stirling Synthetics. Designed to reduce chaffing between the legs for the comfort of skin, slime, scales, fluff, and wood.
  components:
  - type: Sprite
    sprite: _Serenity/Clothing/Uniforms/Jumpskirt/arcadia.rsi
    state: icon
  - type: Clothing
    sprite: _Serenity/Clothing/Uniforms/Jumpskirt/arcadia.rsi

# ── Outer clothing ───────────────────────────────────────────────────────────

- type: entity
  id: ClothingOuterWinterStirling
  parent: ClothingOuterWinterSci
  name: Stirling winter coat
  description: A coat produced by Stirling Synthetics, seems soft.
  components:
  - type: Sprite
    sprite: _Serenity/Clothing/OuterClothing/WinterCoats/arcadia.rsi
    layers:
    - state: icon
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left
      right:
      - state: inhand-right
  - type: Clothing
    sprite: _Serenity/Clothing/OuterClothing/WinterCoats/arcadia.rsi
    clothingVisuals:
      outerClothing:
      - state: equipped-OUTERCLOTHING
  - type: ToggleableClothing
    clothingPrototype: ClothingHeadHatHoodStirling

- type: entity
  id: ClothingOuterCoatStirlingTrench
  parent: ClothingOuterStorageFoldableBase
  name: Stirling flak trenchcoat
  description: A long coat with flak plating sewn into the lining, cut by Stirling Synthetics for people who expect trouble.
  components:
  - type: Sprite
    sprite: _Serenity/Clothing/OuterClothing/Coats/arcadia_trench.rsi
  - type: Clothing
    sprite: _Serenity/Clothing/OuterClothing/Coats/arcadia_trench.rsi
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.9
        Slash: 0.9
        Piercing: 0.4
        Heat: 0.9
        Caustic: 0.75
  - type: ExplosionResistance
    damageCoefficient: 0.50

- type: entity
  id: ClothingOuterEVASuitStirling
  parent: ClothingOuterEVASuitBase
  name: Stirling EVA suit
  description: A pressure suit with the helmet folded into the collar, standard kit for Stirling Synthetics staff.
  components:
  # Serenity: the ToggleableClothing below needs a matching container declared up front, or the
  # prototype's own YAML doesn't reflect the container ToggleableClothingSystem creates on spawn.
  - type: ContainerContainer
    containers:
      toggleable-clothing: !type:ContainerSlot {}
  - type: Sprite
    sprite: _Serenity/Clothing/OuterClothing/Suits/eva_color.rsi
    layers:
    - state: equipped-base
      color: "#ffffff"
    - state: equipped-decals-01
      color: "#8f1717"
    - state: equipped-reinforced-points
      color: "#3e3e48"
    - sprite: _Serenity/Clothing/OuterClothing/Armor/bulletproof_vest_procedural.rsi
      state: decor_base_OuterClothing_armor_02
      color: "#8f1717"
    - state: equipped-breathing-gear
    - state: equipped-unshaded
      shader: unshaded
    - sprite: _Serenity/Clothing/OuterClothing/Armor/bulletproof_vest_procedural.rsi
      state: decor_base_OuterClothing_armor_05
      color: "#8f1717"
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left-base
        color: "#ffffff"
      - state: inhand-left-decals-01
        color: "#8f1717"
      - state: inhand-left-reinforced-points
        color: "#3e3e48"
      - state: inhand-left-breathing-gear
      - state: inhand-left-unshaded
        shader: unshaded
      right:
      - state: inhand-right-base
        color: "#ffffff"
      - state: inhand-right-decals-01
        color: "#8f1717"
      - state: inhand-right-reinforced-points
        color: "#3e3e48"
      - state: inhand-right-breathing-gear
      - state: inhand-right-unshaded
        shader: unshaded
  - type: Clothing
    sprite: _Serenity/Clothing/OuterClothing/Suits/eva_color.rsi
    clothingVisuals:
      outerClothing:
      - state: equipped-base
        color: "#ffffff"
      - state: equipped-decals-01
        color: "#8f1717"
      - state: equipped-reinforced-points
        color: "#3e3e48"
      - sprite: _Serenity/Clothing/OuterClothing/Armor/bulletproof_vest_procedural.rsi
        state: decor_base_OuterClothing_armor_02
        color: "#8f1717"
      - state: equipped-breathing-gear
      - state: equipped-unshaded
        shader: unshaded
      - sprite: _Serenity/Clothing/OuterClothing/Armor/bulletproof_vest_procedural.rsi
        state: decor_base_OuterClothing_armor_05
        color: "#8f1717"
  - type: ToggleableClothing
    clothingPrototype: ClothingHeadEVAHelmetStirling


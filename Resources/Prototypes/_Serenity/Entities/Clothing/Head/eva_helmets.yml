# EVA helmets and hoods for Serenity.
#
# Sprites come from New Frontiers 14 and keep their original licences (CC-BY-SA-3.0 /
# CC-BY-SA-4.0); see each RSI's meta.json for the full credit chain (tgstation, Baystation12,
# erhardsteinhauer, dustylens and others). The prototypes in this file were written fresh
# for Serenity: only ids, palette values, sprite state names and stat numbers were carried over.

# === Bases =====================================================================================

- type: entity
  abstract: true
  id: SerenityEVAHelmetWithLightBase
  parent: ClothingHeadEVAHelmetBase
  name: base EVA helmet with light
  components:
  - type: Sprite
    sprite: _Serenity/Clothing/Head/Helmets/eva_color.rsi
    layers:
    - { state: icon-base }
    - { state: icon-reinforced-points }
    - { state: icon-visor }
    - { state: light-overlay, shader: unshaded, map: [ "light" ], visible: false }
  - type: Clothing
    sprite: _Serenity/Clothing/Head/Helmets/eva_color.rsi
    clothingVisuals:
      head:
      - { state: equipped-head-base }
      - { state: equipped-head-reinforced-points }
      - { state: equipped-head-visor }
  - type: ToggleableVisuals
    spriteLayer: light
    clothingVisuals:
      head:
      - { state: equipped-head-light, shader: unshaded }
  # Serenity: a ConeSingle mask keeps the headlamp a forward beam.
  - type: PointLight
    autoRot: true
    enabled: false
    energy: 1
    lightMask: ConeSingle
    netsync: false
    radius: 6
  - type: ItemTogglePointLight
  - type: HandheldLight
    addPrefix: false
    blinkingBehaviourId: blinking
    radiatingBehaviourId: radiating
  - type: Battery
    maxCharge: 600
    startingCharge: 600
  - type: BatterySelfRecharger
    autoRechargeRate: 2
  - type: Appearance
  - type: LightBehaviour
    behaviours:
    - !type:FadeBehaviour
      id: radiating
      interpolate: Linear
      startValue: 3.0
      endValue: 2.0
      maxDuration: 2.0
      isLooped: true
      reverseWhenFinished: true
    - !type:PulseBehaviour
      id: blinking
      interpolate: Nearest
      startValue: 0.1
      endValue: 2.0
      maxDuration: 1.0
      isLooped: true

# Helmets with a rotating beacon on top (engineering, rescue, law enforcement, pirates).

- type: entity
  abstract: true
  id: SerenityEVAHelmetBeaconBase
  parent: SerenityEVAHelmetWithLightBase
  components:
  # Serenity: ConeDouble so the beacon throws light both ways as it spins.
  - type: PointLight
    energy: 2
    lightMask: ConeDouble
    radius: 2
  - type: RotatingLight
    speed: 360


# === Clear-dome voidsuit helmets ===============================================================
# Serenity: an EVA helmet base without ClothingHeadEVAHelmetBase's hair/snout hiding, so the
# voidsuit domes can choose which layers they cover.

- type: entity
  abstract: true
  id: SerenityClearEVAHelmetBase
  parent: ClothingHeadBase
  name: base space helmet
  components:
  - type: Item
    size: Normal
  - type: Clothing
    equipDelay: 2
    equipSound: /Audio/Mecha/mechmove03.ogg
    unequipDelay: 2
    unequipSound: /Audio/Mecha/mechmove03.ogg
  - type: PressureProtection
    highPressureMultiplier: 0.6
    lowPressureMultiplier: 1000
  - type: TemperatureProtection
    coolingCoefficient: 0.2
    heatingCoefficient: 0.2
  - type: BreathMask
  - type: IngestionBlocker
  - type: IdentityBlocker
  - type: Tag
    tags:
    - WhitelistChameleon
    - HelmetEVA

- type: entity
  id: ClothingHeadHelmetHardsuitFSB
  parent: [ ClothingHeadSuitWithLightBase, SerenityClearEVAHelmetBase ]
  name: biotech voidsuit helmet
  description: A clear-domed voidsuit helmet with a built-in lamp.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _Serenity/Clothing/Head/Helmets/fsb_eva_helmet.rsi
  - type: HideLayerClothing
    slots:
    - Hair
    - HeadTop
    - HeadSide
  # Serenity: no CatWearable, which this codebase does not define.
  - type: Tag
    tags:
    - CorgiWearable
    - ScurretWearable
    - MonkeyWearable
  - type: PointLight
    color: "#adf1ff"
    energy: 4
    radius: 4.5
  - type: ItemTogglePointLight
  - type: HandheldLight
    addPrefix: false
  # Serenity: the light base here swapped its battery for a cell slot; the dome keeps its own.
  - type: Battery
    maxCharge: 600
    startingCharge: 600
  - type: BatterySelfRecharger
    autoRechargeRate: 2
  - type: ToggleableVisuals
    spriteLayer: light
    clothingVisuals:
      head:
      - { state: HELMET-light-glow }
      - { state: on-equipped-HELMET, shader: unshaded }

- type: entity
  id: ClothingHeadHelmetHardsuitFSC
  parent: ClothingHeadHelmetHardsuitFSB
  name: trader's voidsuit helmet
  description: A clear-domed voidsuit helmet with a built-in lamp, in trader colours.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _Serenity/Clothing/Head/Helmets/fsc_eva_helmet.rsi

- type: entity
  id: ClothingHeadHelmetHardsuitFSA
  parent: ClothingHeadHelmetHardsuitFSB
  name: armored voidsuit helmet
  description: A clear-domed voidsuit helmet with a built-in lamp and extra plating.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _Serenity/Clothing/Head/Helmets/fsa_eva_helmet.rsi


# EVA helmets for the EVA suits in _Serenity/Entities/Clothing/OuterClothing/eva_suits.yml
# Ported from New Frontiers 14 (https://github.com/new-frontiers-14/frontier-station-14, commit 8ed2648):
#   _NF/Entities/Clothing/Head/softsuits-helmets.yml, goblin_headwear.yml, base_clothinghead.yml (clear EVA helmet base)
# Sprites: CC-BY-SA-3.0 / CC-BY-SA-4.0 (see each RSI's meta.json), mostly by erhardsteinhauer and dustylens for New Frontiers 14
#
# Serenity: the Arcadia EVA helmet is not repeated here, it was already ported as ClothingHeadEVAHelmetStirling (arcadia.yml).
# Serenity: Frontier's CatWearable component doesn't exist here and was dropped from every helmet.

#region base
- type: entity
  abstract: true
  parent: ClothingHeadEVAHelmetBase
  id: SerenityEVAHelmetWithLightBase
  name: base EVA helmet with light
  components:
  - type: Sprite
    sprite: _Serenity/Clothing/Head/Helmets/eva_color.rsi
    layers:
    - state: icon-base
    - state: icon-reinforced-points
    - state: icon-visor
    - state: light-overlay
      visible: false
      shader: unshaded
      map: [ "light" ]
  - type: HandheldLight
    addPrefix: false
    blinkingBehaviourId: blinking
    radiatingBehaviourId: radiating
  - type: LightBehaviour
    behaviours:
      - !type:FadeBehaviour
        id: radiating
        interpolate: Linear
        maxDuration: 2.0
        startValue: 3.0
        endValue: 2.0
        isLooped: true
        reverseWhenFinished: true
      - !type:PulseBehaviour
        id: blinking
        interpolate: Nearest
        maxDuration: 1.0
        startValue: 0.1
        endValue: 2.0
        isLooped: true
  - type: Battery # Apparently lights on helmets don't work without batteries. Bummer.
    maxCharge: 600 #lights drain 3/s but recharge of 2 makes this 1/s. Therefore 600 is 10 minutes of light.
    startingCharge: 600
  - type: BatterySelfRecharger
    # Serenity: autoRecharge dropped, BatterySelfRechargerComponent has no such field here (it always recharges).
    autoRechargeRate: 2 #recharge of 2 makes total drain 1w / s so max charge is 1:1 with time. Time to fully charge should be 5 minutes. Having recharge gives light an extended flicker period which gives you some warning to return to light area.
  - type: Appearance
  - type: ToggleableVisuals
    spriteLayer: light
    clothingVisuals:
      head:
      - state: equipped-head-light
        shader: unshaded
  - type: Clothing
    clothingVisuals:
      head:
      - state: equipped-head-base
      - state: equipped-head-reinforced-points
      - state: equipped-head-visor
  - type: ItemTogglePointLight
  - type: PointLight
    #color: "#adffe6"
    enabled: false
    radius: 6
    energy: 1
    lightMask: ConeSingle # Serenity: Frontier used mask: cone.png; Serenity lights use the equivalent lightMask prototype
    autoRot: true
    netsync: false


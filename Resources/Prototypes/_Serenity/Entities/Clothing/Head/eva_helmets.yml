#region Far Star Void suit helmet
- type: entity
  abstract: true
  parent: ClothingHeadBase
  id: SerenityClearEVAHelmetBase # This version is to allow for choice regarding HideLayerClothing for clear helmets. Is otherwise identical to ClothingHeadEVAHelmetBase
  name: base space helmet
  components:
  - type: BreathMask
  - type: Item
    size: Normal
  - type: PressureProtection
    highPressureMultiplier: 0.6
    lowPressureMultiplier: 1000
  - type: TemperatureProtection
    heatingCoefficient: 0.2
    coolingCoefficient: 0.2
  - type: IngestionBlocker
  - type: Clothing
    #Copies ClothingHeadHardsuitBase behavior
    equipSound: /Audio/Mecha/mechmove03.ogg
    unequipSound: /Audio/Mecha/mechmove03.ogg
    equipDelay: 2
    unequipDelay: 2
  - type: Tag
    tags:
    - WhitelistChameleon
    - HelmetEVA
  - type: IdentityBlocker

- type: entity
  parent: [ ClothingHeadSuitWithLightBase, SerenityClearEVAHelmetBase ]
  id: ClothingHeadHelmetHardsuitFSB
  name: Far Star Biotech voidsuit helmet
  description: A lightweight suit helmet that doesn't restrict your head movements. It has a light!
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _Serenity/Clothing/Head/Helmets/fsb_eva_helmet.rsi
  - type: ToggleableVisuals
    spriteLayer: light
    clothingVisuals:
      head:
      - state: HELMET-light-glow
      - state: on-equipped-HELMET
        shader: unshaded
  - type: HandheldLight
    addPrefix: false
  - type: ItemTogglePointLight
  - type: PointLight
    color: "#adf1ff"
    # Serenity: Frontier's ClothingHeadSuitWithLightBase set these; Serenity's leaves radius/energy to the
    # ClothingHeadLightParams* prototypes, so Frontier's values are restated here.
    radius: 4.5
    energy: 4
  # Serenity: Frontier's ClothingHeadSuitWithLightBase powered the light with a self-recharging battery. Serenity's
  # draws from the hardsuit's power cell instead, which the FSB/FSC softsuits don't have, so the battery is restored.
  - type: Battery
    maxCharge: 600 #lights drain 3/s but recharge of 2 makes this 1/s. Therefore 600 is 10 minutes of light.
    startingCharge: 600
  - type: BatterySelfRecharger
    autoRechargeRate: 2
  - type: HideLayerClothing
    slots:
    - Hair
    - HeadTop
    - HeadSide
  - type: Tag
    tags:
    - CorgiWearable
    - ScurretWearable
    - MonkeyWearable


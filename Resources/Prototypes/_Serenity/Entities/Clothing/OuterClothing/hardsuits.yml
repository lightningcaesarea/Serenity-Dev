- type: entity
  parent: [ ClothingOuterHardsuitBase, BaseCentcommContraband ]
  id: ClothingOuterHardsuitColonialNavalInfantry
  name: Marine Raider M21 infantry hardsuit
  description: A moderately armored mobile hardsuit used by the Marine Raiders. It features a distinctive black and dark grey color scheme with a blue visor, and is equipped with a reinforced helmet for enhanced protection.
  components:
  - type: Sprite
    sprite: _Serenity/Clothing/OuterClothing/Hardsuits/colonialnavalinfantryHS.rsi
  - type: Clothing
    sprite: _Serenity/Clothing/OuterClothing/Hardsuits/colonialnavalinfantryHS.rsi
  - type: ToggleableClothing
    clothingPrototype: ClothingHeadHelmetHardsuitColonialNavalInfantry
  - type: ExplosionResistance
    damageCoefficient: 0.5
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.35
        Slash: 0.25
        Piercing: 0.2
        Heat: 0.25
        Radiation: 0.4
        Caustic: 0.4
  - type: ClothingSpeedModifier
    walkModifier: 0.75
    sprintModifier: 0.75
  - type: Tag
    tags:
    - Hardsuit
    - WhitelistChameleon
    - CorgiWearable

- type: entity
  parent: ClothingHeadHelmetHardsuitSyndie
  id: ClothingHeadHelmetHardsuitColonialNavalInfantry
  categories: [ HideSpawnMenu ]
  name: Marine Raider M21 infantry hardsuit helmet
  description: A reinforced hardsuit helmet used by the Marine Raiders.
  components:
  - type: Sprite
    sprite: _Serenity/Clothing/OuterClothing/Hardsuits/colonialnavalinfantryHSHelm.rsi
  - type: Clothing
    sprite: _Serenity/Clothing/OuterClothing/Hardsuits/colonialnavalinfantryHSHelm.rsi
  - type: PointLight
    color: "#5162FF"
  - type: PressureProtection
    highPressureMultiplier: 0.35
    lowPressureMultiplier: 1000
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.85
        Slash: 0.85
        Piercing: 0.85
        Heat: 0.85
        Radiation: 0.95
        Caustic: 0.9

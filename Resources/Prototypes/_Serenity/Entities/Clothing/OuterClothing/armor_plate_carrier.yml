# Outer clothing that can take an armor plate: a small compartment, and the first armor plate put
# in it is the active plate. ClothingOuterArmorBase and ClothingOuterHardsuitBase inherit this.
# Armor that already had pockets keeps its own Storage settings; plates only fit if the pockets allow
# Normal-sized items.

- type: entity
  abstract: true
  id: ClothingArmorPlateCarrier
  components:
  - type: ArmorPlateCarrier
  - type: Storage
    maxItemSize: Normal
    grid:
    - 0,0,1,1
  - type: ContainerContainer
    containers:
      storagebase: !type:Container
        ents: []
  - type: UserInterface
    interfaces:
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface

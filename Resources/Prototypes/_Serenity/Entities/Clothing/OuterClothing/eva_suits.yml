# EVA suits, voidsuits and robes for Serenity.
#
# Sprites come from New Frontiers 14 and keep their original licences (CC-BY-SA-3.0 /
# CC-BY-SA-4.0); see each RSI's meta.json for the full credit chain (tgstation, Baystation12,
# erhardsteinhauer, dustylens and others). The prototypes in this file were written fresh
# for Serenity: only ids, palette values, sprite state names and stat numbers were carried over.

# === Bases =====================================================================================
# Every suit here builds on this. Serenity: it does not inherit ClothingOuterHardsuitBase, so the
# geiger counter, armor values and GroupExamine are pulled in explicitly instead.

- type: entity
  abstract: true
  id: SerenityEVASuitBase
  parent: [ ClothingOuterStorageBase, ClothingOuterEVASuitBase, GeigerCounterClothing ]
  components:
  - type: ClothingSpeedModifier
    sprintModifier: 0.95
    walkModifier: 0.95
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.9
        Heat: 0.9
        Piercing: 0.95
        Radiation: 0.25
        Slash: 0.9
  - type: GroupExamine
  - type: Item
    shape:
    - 0,0,3,2
  - type: Clothing
    equipSound: /Audio/Mecha/mechmove03.ogg
    unequipSound: /Audio/Mecha/mechmove03.ogg
  - type: PhysicalComposition
    materialComposition:
      Cloth: 50
      Durathread: 100
  - type: Tag
    tags:
    - SuitEVA
    - WhitelistChameleon
  # Serenity: declare the helmet slot next to the pocket storage so the container set is
  # known before ToggleableClothing fills it on spawn.
  - type: ContainerContainer
    containers:
      storagebase: !type:Container
        ents: []
      toggleable-clothing: !type:ContainerSlot {}

# The recoloured job suits all share one greyscale sheet and tint it per layer.

- type: entity
  abstract: true
  id: SerenityDepartmentalEVASuit
  parent: SerenityEVASuitBase
  components:
  - type: Sprite
    sprite: _Serenity/Clothing/OuterClothing/Suits/eva_color.rsi
  - type: Clothing
    sprite: _Serenity/Clothing/OuterClothing/Suits/eva_color.rsi
  # Serenity: no CatWearable, which this codebase does not define.
  - type: Tag
    tags:
    - SuitEVA
    - WhitelistChameleon
    - MonkeyWearable

# Same suit with a lamp mounted on the shoulder.

- type: entity
  abstract: true
  id: SerenityDepartmentalEVASuitShoulderLight
  parent: SerenityDepartmentalEVASuit
  components:
  - type: Sprite
    layers:
    - { state: icon-base }
    - { state: icon-decals-01 }
    - { state: icon-reinforced-points }
    - { state: icon-shoulder-light }
    - { state: icon-breathing-gear }
    - { state: icon-unshaded }
    - { state: icon-shoulder-light-overlay-unshaded, shader: unshaded, map: [ "light" ], visible: false }
  - type: Clothing
    clothingVisuals:
      outerClothing:
      - { state: equipped-base }
      - { state: equipped-decals-01 }
      - { state: equipped-reinforced-points }
      - { state: equipped-shoulder-light }
      - { state: equipped-breathing-gear }
      - { state: equipped-unshaded }
  - type: ToggleableVisuals
    spriteLayer: light
    clothingVisuals:
      outerClothing:
      - { state: equipped-shoulder-light-overlay-unshaded, shader: unshaded }
  # Serenity: ConeSingle, a forward beam from the shoulder.
  - type: PointLight
    autoRot: true
    enabled: false
    energy: 1
    lightMask: ConeSingle
    netsync: false
    radius: 6
  - type: ItemTogglePointLight
  - type: HandheldLight
    addPrefix: false
    blinkingBehaviourId: blinking
    radiatingBehaviourId: radiating
  - type: Battery
    maxCharge: 600
    startingCharge: 600
  - type: BatterySelfRecharger
    autoRechargeRate: 2
  - type: Appearance
  - type: LightBehaviour
    behaviours:
    - !type:FadeBehaviour
      id: radiating
      interpolate: Linear
      startValue: 3.0
      endValue: 2.0
      maxDuration: 2.0
      isLooped: true
      reverseWhenFinished: true
    - !type:PulseBehaviour
      id: blinking
      interpolate: Nearest
      startValue: 0.1
      endValue: 2.0
      maxDuration: 1.0
      isLooped: true


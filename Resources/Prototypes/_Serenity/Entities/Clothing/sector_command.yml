# Sector Command clothing, ported from Hullrot (Sector Crescent) Empire gear and recolored
# to Sector Command charcoal and orange-gold. Only sprites credited to Shiptest/tgstation
# (CC-BY-SA-3.0) were taken; see each meta.json for credit. Prototypes are written for Serenity.

# ── Uniforms ──────────────────────────────────────────────────────────────────

- type: entity
  parent: ClothingUniformBase
  id: ClothingUniformJumpsuitSectorCommandHighCommand
  name: Sector Command high command uniform
  description: A charcoal dress uniform with orange-gold braid, reserved for Sector Command's ranking officers.
  components:

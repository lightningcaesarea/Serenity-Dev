# BDSM bed: a latex bed with D-rings along the sides. Buckling works like any bed.
- type: entity
  parent: Bed
  id: BdsmBed
  name: BDSM bed
  description: A latex-covered bed with D-rings along the sides. Looks comfortable, for a while.
  components:
  - type: Sprite
    sprite: _Serenity/Structures/Furniture/bdsm_bed.rsi
    state: bed
  - type: Construction
    graph: BdsmBed
    node: bed
  - type: StaticPrice
    price: 120

# Pillow piles: a soft heap to sink into.
- type: entity
  abstract: true
  parent: ChairBase
  id: PillowPileBase
  name: pillow pile
  description: A soft heap of pillows to sink into.
  components:
  - type: Sprite
    sprite: _Serenity/Structures/Furniture/pillow_pile.rsi
    noRot: true
  - type: Strap
    position: Stand
    buckleOffset: "0,0.1"
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Inflatable
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:SpawnEntitiesBehavior
        spawn:
          MaterialCloth1:
            min: 1
            max: 3
  - type: StaticPrice
    price: 30

- type: entity
  parent: PillowPileBase
  id: PillowPileSmallPink
  suffix: Small, Pink
  components:
  - type: Sprite
    state: small_pink
  - type: Construction
    graph: PillowPile
    node: smallPink

- type: entity

# Lewd furniture that needs no code of its own: a dancing pole, a BDSM bed and pillow piles.
# Art: CC-BY-SA-3.0 from Skyrat-tg, see each RSI's meta.json.

# Dancing pole: buckle onto it to dance. The neon ring in the base can be switched on and off.
- type: entity
  abstract: true
  parent: ChairBase
  id: DancingPoleBase
  name: dancing pole
  description: A polished steel pole on a neon-lit base, for showing off your great assets.
  components:
  - type: Sprite
    sprite: _Serenity/Structures/Furniture/dancing_pole.rsi
    noRot: true
    offset: "0,0.65625" # The art is 74px tall with the base at the bottom; this sits the base on the tile.
  - type: Strap
    position: Stand
    buckleOffset: "0,0"
  - type: ItemToggle
    activated: true
    onUse: false
  - type: ItemTogglePointLight
  - type: ToggleableVisuals
    spriteLayer: glow
  - type: PointLight
    enabled: false
    radius: 1.5
    energy: 1.5
    netsync: false
  - type: Appearance
  - type: StaticPrice
    price: 75

- type: entity
  parent: DancingPoleBase
  id: DancingPole
  suffix: Purple
  components:
  - type: Sprite
    layers:
    - state: pole_purple
    - state: pole_purple_glow
      map: [ "glow" ]
      shader: unshaded
      visible: false
  - type: PointLight
    color: "#b24cff"
  - type: Construction
    graph: DancingPole
    node: purple

- type: entity
  parent: DancingPoleBase
  id: DancingPoleCyan
  suffix: Cyan
  components:

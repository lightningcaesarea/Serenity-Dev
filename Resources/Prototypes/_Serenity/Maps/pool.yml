# Serenity runs the Outpost hub or, for small populations, the Cluster; the pool holds just those two maps. Replaces Starlight's
# DefaultStarlightMapPool as the `game.map_pool` default; map voting is off (vote.map_enabled and
# vote.run_map_vote_after_restart default to false).
- type: gameMapPool
  id: SerenityMapPool
  maps:
  - SerenityOutpost
  - SerenityCluster

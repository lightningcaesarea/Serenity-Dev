- type: entity
  id: Vaccinator
  parent: BaseMachinePowered
  name: antibiotic synthesizer
  description: Turns broad-spectrum antibiotic into the narrow-spectrum drug for one pathogen. Insert a blood culture report to program it, then a container of Antibiox.
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    sprite: Structures/Machines/vaccinator.rsi
    layers:
    - state: icon
      map: ["enum.DiseaseMachineVisualLayers.IsRunning"]
    - state: unlit
      shader: unshaded
      map: ["enum.DiseaseMachineVisualLayers.IsOn"]
  - type: Appearance
  - type: Machine
    board: VaccinatorMachineCircuitboard
  - type: PathogenSynthesizer
  - type: ContainerContainer
    containers:
      machine_board: !type:Container
      machine_parts: !type:Container
  - type: RequireProjectileTarget

- type: entity
  parent: BaseItem
  id: BaseStarlightAdmemePaper
  abstract: true
  components:
    - type: Tag
      tags:
        - Document
    - type: Appearance
    - type: Item
      size: Tiny
    - type: PaperVisuals
    - type: PaperLabelType
    - type: ActivatableUI
      key: enum.PaperUiKey.Key
      requiresComplex: false
    - type: UserInterface
      interfaces:
        enum.PaperUiKey.Key:
          type: PaperBoundUserInterface
    - type: Sprite
      sprite: Objects/Misc/bureaucracy.rsi
      layers:
      - state: paper
      - state: paper_words
        map: ["enum.PaperVisualLayers.Writing"]
        visible: false
      - state: paper_stamp-generic
        map: ["enum.PaperVisualLayers.Stamp"]
        visible: false

- type: entity
  parent: BaseItem
  id: BaseUnburnablePaper
  abstract: true
  components:
  - type: Tag
    tags:
    - Document
    - Paper
  - type: Appearance
  - type: FireVisuals
    sprite: Effects/fire.rsi
    normalState: fire
  - type: Damageable
    damageModifierSet: Wood
  - type: Edible
    solution: food
    delay: 7
    forceFeedDelay: 7
  - type: FlavorProfile
    flavors:
    - paper
  - type: BadFood
  - type: Solution
    id: food
    solution:
      maxVol: 1
      reagents:
      - ReagentId: Fiber
        Quantity: 1
  - type: Material
  - type: PhysicalComposition
    materialComposition:
      SheetPrinter: 100
  - type: Item
    size: Tiny
  - type: PaperVisuals
  - type: PaperLabelType
  - type: ActivatableUI
    key: enum.PaperUiKey.Key
    requiresComplex: false
  - type: UserInterface
    interfaces:
      enum.PaperUiKey.Key:
        type: PaperBoundUserInterface
  - type: Sprite
    sprite: Objects/Misc/bureaucracy.rsi
    layers:
    - state: paper
    - state: paper_words
      map: ["enum.PaperVisualLayers.Writing"]
      visible: false
    - state: paper_stamp-generic
      map: ["enum.PaperVisualLayers.Stamp"]
      visible: false

- type: entity
  id: PaperIonstormBorgs
  name: robots too orderly?
  description: A paper. it seems to feel slightly electric in your hands. would probally destroy a fax if you insered it.
  parent: [ Paper ]
  components:
    - type: Paper
      content: paper-ionstorm-borgs
    - type: ActionsOnSign
      actions: IonStormInfinite

- type: entity
  parent: BaseStarlightAdmemePaper
  id: PaperEndGreenshift
  name: restart the clock.
  description: A paper that seems to "start the clock" again? the countdown causes it to be too big to fix into a fax.
  components:
    - type: Paper
      content: paper-end-greenshift-vote
      editingDisabled: true
    - type: ActionsOnSign
      actions: AddSecretRule
      instant: false
    - type: ChargesExamine
    - type: AdjustChargesPopBased
      percent: 0.65 # 65% of pop has to sign.

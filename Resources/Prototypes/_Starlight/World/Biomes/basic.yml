- type: spaceBiome
  id: AsteroidsStandard
  priority: 0 # This probably shouldn't get selected.
  noiseRanges: {}
  chunkComponents:
    - type: DebrisFeaturePlacerController
      densityNoiseChannel: Density
    - type: SimpleDebrisSelector
      debrisTable:
        - id: AsteroidDebrisSmall
        - id: AsteroidDebrisMedium
        - id: AsteroidDebrisLarge
          prob: 0.7
# Starlight Start
        - id: TrashDebrisSmall
        - id: TrashDebrisMedium
        - id: TrashDebrisLarge
          prob: 0.4
        - id: MeatDebrisSmall
        - id: MeatDebrisMedium
          prob: 0.2
        - id: MeatDebrisLarge
          prob: 0.1
#Starlight End
        - id: AsteroidDebrisLarger
          prob: 0.4
# Serenity Start — ore-rich variants already exist as prototypes (AsteroidSalvage*) but were never
# added to the roll; Frontier Station 14's MIT-era asteroid biome included their equivalent at these
# weights, so wire them in the same way instead of leaving them unused.
        - id: AsteroidSalvageSmall
          prob: 0.15
        - id: AsteroidSalvageMedium
          prob: 0.08
        - id: AsteroidSalvageLarge
          prob: 0.04
        - id: AsteroidSalvageHuge
          prob: 0.015
# Serenity End
# Serenity Start - wreck dungeons (formerly a fixed ring around the station), see _Serenity/World/dungeon_debris.yml
        - id: DungeonDebrisChunkDebrisSmall
          prob: 0.12
        - id: DungeonDebrisChunkDebris
          prob: 0.06
        - id: DungeonDebrisClusterAsteroid
          prob: 0.05
        - id: DungeonDebrisSpindlyAsteroid
          prob: 0.05
        - id: DungeonDebrisBlobAsteroid
          prob: 0.05
        - id: DungeonDebrisSwissCheeseAsteroid
          prob: 0.05
        - id: DungeonDebrisClusterTrash
          prob: 0.05
        - id: DungeonDebrisSpindlyTrash
          prob: 0.05
        - id: DungeonDebrisBlobAsteroidTrash
          prob: 0.05
        - id: DungeonDebrisSwissCheeseTrash
          prob: 0.05
        - id: DungeonDebrisClusterMeat
          prob: 0.05
        - id: DungeonDebrisSpindlyMeat
          prob: 0.05
        - id: DungeonDebrisBlobAsteroidSnow
          prob: 0.05
        - id: DungeonDebrisClusterSnow
          prob: 0.05
        - id: DungeonDebrisSwissCheeseSnow
          prob: 0.05
# Serenity End
    - type: NoiseDrivenDebrisSelector
      noiseChannel: Wreck
      debrisTable:
        - id: ScrapDebrisSmall
        - id: ScrapDebrisMedium
        - id: ScrapDebrisLarge
          prob: 0.5
    - type: NoiseRangeCarver
      ranges:
        - 0.4, 0.6
      noiseChannel: Carver

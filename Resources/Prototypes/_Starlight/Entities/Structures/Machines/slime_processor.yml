- type: entity
  id: SlimeProcessor
  parent: [ BaseMachinePowered, ConstructibleMachine ]
  name: slime processor
  description: Turns slime corpses into extracts. Try freezing them first!
  placement:
    mode: SnapgridCenter
  components:
    - type: Sprite
      sprite: _Starlight/Structures/Machines/slime_processor.rsi
      state: slime_processor_icon
      snapCardinals: true
    - type: SlimeProcessor
      processingTime: 5s
      yieldMultiplier: 4
      slimeAcquireCooldown: 1s
    - type: CollectingSlimeProcessor
    # Serenity-start: pays research points per extract to the research server on its grid
    - type: ResearchClient
    - type: SlimeProcessorResearch
      tierPoints:
        SlimeExtractTier0: 100
        SlimeExtractTier1: 300
        SlimeExtractTier2: 800
        SlimeExtractTier3: 2000
        SlimeExtractTier4: 6000
    # Serenity-end
    - type: Machine
      board: SlimeProcessorMachineCircuitboard
    - type: ContainerContainer

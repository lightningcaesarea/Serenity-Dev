- type: gameMap
  id: StarlightCog
  mapName: 'Cog'
  mapPath: /Maps/_Starlight/Stations/Cog.yml
  minPlayers: 40
  maxPlayers: 150 #big map
  stations:
    StarlightCog:
      stationProto: StandardNanotrasenStation
      components:
        - type: StationNameSetup
          mapNameTemplate: '{0} Cog {1}'
          nameGenerator:
            !type:NanotrasenNameGenerator
            prefixCreator: 'R4' # R4407/Goon. GS isn't as cool sounding.
        - type: StationEmergencyShuttle
          emergencyShuttlePath: /Maps/Shuttles/emergency_wode.yml
        - type: StationJobs
          availableJobs:
            #service
            HeadOfPersonnel: [ 1, 1 ]
            Bartender: [ 2, 2 ]
            Botanist: [ 3, 3 ]
            Chef: [ 2, 2 ]
            ServiceWorker: [ 3, 3 ]
            RadioHost: [ 2, 2 ]
            #engineering
            StationEngineer: [ 4, 4 ]
            TechnicalAssistant: [ 3, 3 ]
            #medical
            MedicalDoctor: [ 7, 7 ]
            MedicalIntern: [ 3, 3 ]
            Paramedic: [ 2, 2 ]
            #science
            Scientist: [ 5, 5 ]
            ResearchAssistant: [ 3, 3 ]
            #security
            HeadOfSecurity: [ 1, 1 ]
            Warden: [ 1, 1 ]
            SecurityOfficer: [ 6, 8 ]
            SeniorOfficer: [ 1, 1 ] # Serenity
            SecurityCadet: [ 3, 4 ]
            Brigmedic: [ 1, 1 ]
            #supply
            MailTech: [ 1, 2 ]
            #civilian
            AssistantManager: [ 1, 1 ]
            Assistant: [ -1, -1 ]
            #silicon
            Borg: [ 4, 5 ]
            #law
            #Representatives

- type: gameMap
  id: StarlightSilica
  mapName: 'Silica Station'
  mapPath: /Maps/_Starlight/Stations/Silica.yml
  minPlayers: 25
  maxPlayers: 150
  stations:
    StarlightSilica:
      stationProto: StandardNanotrasenStation
      components:
        - type: StationNameSetup
          mapNameTemplate: '{0} Silica Station {1}'
          nameGenerator:
            !type:NanotrasenNameGenerator
            prefixCreator: 'CW'
        - type: StationEmergencyShuttle
          emergencyShuttlePath: /Maps/_Starlight/Shuttles/Evac/emergency_silica.yml
        - type: StationCargoShuttle
          path: /Maps/_Starlight/Shuttles/Cargo/cargo_silica.yml
        - type: StationJobs
          availableJobs:
            #service
            HeadOfPersonnel: [ 1, 1 ]

            Bartender: [ 2, 2 ]
            Botanist: [ 2, 2 ]
            Chef: [ 2, 2 ]
            ServiceWorker: [ 2, 4 ]

            RadioHost: [ 2, 2 ]


            #engineering
            StationEngineer: [ 5, 5 ]
            TechnicalAssistant: [ 3, 4 ]

            #medical
            MedicalDoctor: [ 6, 8 ]
            MedicalIntern: [ 3, 4 ]
            Paramedic: [ 2, 2 ]

            #science
            Scientist: [ 4, 6 ]
            ResearchAssistant: [ 3, 4 ]

            #security
            HeadOfSecurity: [ 1, 1 ]
            Warden: [ 1, 1 ]
            Brigmedic: [ 1, 1 ]
            SecurityOfficer: [ 6, 8 ]
            SeniorOfficer: [ 1, 1 ] # Serenity
            SecurityCadet: [ 3, 4 ]

            #supply
            MailTech: [ 1, 2 ]
            MiningSpecialist: [ 3, 4 ]

            # ITG
            SalvageLead: [ 1, 1 ]
            SalvageMedic: [ 1, 1 ]

            #civilian
            AssistantManager: [ 2, 2 ]
            Assistant: [ -1, -1 ]

            #silicon
            Borg: [ 3, 4 ]

            #Representatives

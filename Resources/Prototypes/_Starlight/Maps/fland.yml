- type: gameMap
  id: StarlightFland
  mapName: 'Fland Installation'
  mapPath: /Maps/_Starlight/Stations/Fland.yml
  minPlayers: 65
  maxPlayers: 350
  stations:
    StarlightFland:
      stationProto: StandardNanotrasenStation
      components:
        - type: StationNameSetup
          mapNameTemplate: '{0} Fland Installation {1}'
          nameGenerator:
            !type:NanotrasenNameGenerator
            prefixCreator: 'B'
        - type: StationEmergencyShuttle
          emergencyShuttlePath: /Maps/_Starlight/Shuttles/Evac/emergency_delta.yml
        - type: StationCargoShuttle
          path: /Maps/_Starlight/Shuttles/Cargo/cargo_silica.yml
        - type: StationJobs
          availableJobs:
            #service
            HeadOfPersonnel: [ 1, 1 ]
            Bartender: [ 2, 2 ]
            Botanist: [ 3, 3 ]
            Chef: [ 2, 2 ]
            ServiceWorker: [ 3, 3 ]
            RadioHost: [ 2, 2 ]
            #engineering
            StationEngineer: [ 5, 5 ]
            TechnicalAssistant: [ 4, 4 ]
            #medical
            MedicalDoctor: [ 9, 9 ]
            Paramedic: [ 2, 2 ]
            MedicalIntern: [ 4, 4 ]
            #science
            Scientist: [ 5, 5 ]
            ResearchAssistant: [ 6, 6 ]
            #security
            HeadOfSecurity: [ 1, 1 ]
            Warden: [ 1, 1 ]
            SecurityOfficer: [ 12, 12 ]
            SeniorOfficer: [ 1, 1 ] # Serenity
            SecurityCadet: [ 6, 6 ]
            Brigmedic: [ 2, 2 ]
            #supply
            SalvageLead: [ 1, 1 ]
            SalvageMedic: [ 1, 1 ]
            MiningSpecialist: [ 4, 4 ]
            MailTech: [ 2, 2 ]
            #civilian
            AssistantManager: [ 2, 2 ]
            Assistant: [ -1, -1 ]
            #silicon
            Borg: [ 4, 4 ]
            #law
            #Representatives

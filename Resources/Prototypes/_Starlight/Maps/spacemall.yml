- type: gameMap
  id: StarlightSpaceMall
  mapName: 'Space Mall'
  mapPath: /Maps/_Starlight/Stations/SpaceMall.yml
  minPlayers: 60
  maxPlayers: 350
  stations:
    StarlightSpaceMall:
      stationProto: StandardNanotrasenStation
      components:
        - type: StationNameSetup
          mapNameTemplate: '{0} Space Mall {1}'
          nameGenerator:
            !type:NanotrasenNameGenerator
            prefixCreator: 'ST'
        - type: StationEmergencyShuttle
          emergencyShuttlePath: /Maps/_Starlight/Shuttles/Evac/emergency_spacemall.yml
        - type: StationJobs
          availableJobs:
            #service
            HeadOfPersonnel: [ 1, 1 ]
            Bartender: [ 4, 4 ]
            Botanist: [ 3, 3 ]
            Chef: [ 4, 4 ]
            ServiceWorker: [ 5, 5 ]
            RadioHost: [ 2, 2 ]
            #engineering
            StationEngineer: [ 6, 6 ]
            TechnicalAssistant: [ 4, 4 ]
            #medical
            MedicalDoctor: [ 9, 9 ]
            Paramedic: [ 2, 2 ]
            MedicalIntern: [ 3, 3 ]
            #science
            Scientist: [ 6, 6 ]
            ResearchAssistant: [ 4, 4 ]
            #security
            HeadOfSecurity: [ 1, 1 ]
            Warden: [ 1, 1 ]
            SecurityOfficer: [ 12, 12 ]
            SeniorOfficer: [ 1, 1 ] # Serenity
            SecurityCadet: [ 6, 6 ]
            Brigmedic: [ 2, 2 ]
            #supply
            MailTech: [ 2, 2 ]
            #civilian
            AssistantManager: [ 2, 2 ]
            Assistant: [ -1, -1 ]
            #silicon
            Borg: [ 5, 5 ]
            #law
            #Representatives

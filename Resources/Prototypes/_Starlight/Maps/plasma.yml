- type: gameMap
  id: StarlightPlasma
  mapName: 'Plasma'
  mapPath: /Maps/_Starlight/Stations/Plasma.yml
  minPlayers: 25
  maxPlayers: 80
  stations:
    StarlightPlasma:
      stationProto: StandardNanotrasenStation
      components:
        - type: StationNameSetup
          mapNameTemplate: '{0} Plasma {1}'
          nameGenerator:
            !type:NanotrasenNameGenerator
            prefixCreator: '14'
        - type: StationEmergencyShuttle
          emergencyShuttlePath: /Maps/Shuttles/emergency_plasma.yml
        - type: StationCargoShuttle
          path: /Maps/_Starlight/Shuttles/Cargo/cargo_plasma.yml
        - type: StationJobs
          availableJobs:
            #command (7)
            HeadOfPersonnel: [ 1, 1 ]
            HeadOfSecurity: [ 1, 1 ]
            #service (17)
            Bartender: [ 2, 2 ]
            Botanist: [ 2, 2 ]
            Chef: [ 2, 2 ]
            ServiceWorker: [ 2, 2 ]
            RadioHost: [ 2, 2 ]
            #engineering (8)
            StationEngineer: [ 4, 4 ]
            TechnicalAssistant: [ 4, 4 ] #intern, not counted
            #medical (10 - 11)
            MedicalDoctor: [ 5, 5 ]
            Paramedic: [ 2, 2 ]
            MedicalIntern: [ 4, 4 ] #intern, not counted
            #science (4)
            Scientist: [ 3, 3 ]
            ResearchAssistant: [ 4, 4 ] #intern, not counted
            #security (12 - 14)
            Warden: [ 1, 1 ]
            SecurityOfficer: [ 4, 6 ]
            SeniorOfficer: [ 1, 1 ] # Serenity
            SecurityCadet: [ 2, 3 ] #intern, not counted
            Brigmedic: [ 1, 1 ]
            #supply (12 - 15)
            SalvageLead: [ 1, 1 ]
            SalvageMedic: [ 1, 1 ]
            MiningSpecialist: [ 3, 3 ] #the miners... yearn for the mines...
            MailTech: [ 1, 2 ]
            #civilian (3 - 4+)
            Assistant: [ -1, -1 ]  #infinite, the tiders yearn for the mines
            #silicon (3 - 5)
            Borg: [ 2, 4 ]
            #law
            #representatives (2)

- type: gameMap
  id: StarlightPacked
  mapName: 'Packed'
  mapPath: /Maps/_Starlight/Stations/Packed.yml
  minPlayers: 0
  maxPlayers: 35
  stations:
    StarlightPacked:
      stationProto: StandardNanotrasenStation
      components:
        - type: StationNameSetup
          mapNameTemplate: '{0} Packed {1}'
          nameGenerator:
            !type:NanotrasenNameGenerator
            prefixCreator: 'VG'
        - type: StationEmergencyShuttle
          emergencyShuttlePath: /Maps/Shuttles/emergency_crimson.yml
        - type: StationJobs
          availableJobs:
            #service
            HeadOfPersonnel: [ 1, 1 ]
            Bartender: [ 1, 1 ]
            Botanist: [ 1, 2 ]
            Chef: [ 1, 1 ]
            RadioHost: [ 1, 1 ]
            ServiceWorker: [ 2, 2 ]
            #engineering
            StationEngineer: [ 4, 4 ]
            TechnicalAssistant: [ 3, 3 ]
            #medical
            MedicalDoctor: [ 5, 5 ]
            MedicalIntern: [ 2, 2 ]
            Paramedic: [ 1, 1 ]
            #science
            Scientist: [ 4, 4 ]
            ResearchAssistant: [ 2, 2 ]
            #security
            HeadOfSecurity: [ 1, 1 ]
            Warden: [ 1, 1 ]
            SecurityOfficer: [ 3, 3 ]
            SeniorOfficer: [ 1, 1 ] # Serenity
            SecurityCadet: [ 2, 2 ]
            Brigmedic: [ 1, 1 ]
            #supply
            MailTech: [ 1, 2 ]
            #civilian
            Assistant: [ -1, -1 ]
            #silicon
            Borg: [ 2, 2 ]
            #law
            #Representatives

            MedicalDoctor: [ 5, 6 ]
            Paramedic: [ 1, 2 ]
            MedicalIntern: [ 2, 3 ]
            #science
            Scientist: [ 3, 4 ]
            ResearchAssistant: [ 2, 3 ]
            #security
            HeadOfSecurity: [ 1, 1 ]
            Warden: [ 1, 1 ]
            SecurityOfficer: [ 4, 6 ]
            SeniorOfficer: [ 1, 1 ] # Serenity
            SecurityCadet: [ 3, 4 ]
            Brigmedic: [ 1, 1 ]
            #supply
            MiningSpecialist: [ 3, 4 ]
            SalvageMedic: [ 1, 1 ]
            MailTech: [ 1, 2 ]

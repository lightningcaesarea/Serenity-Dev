- type: gameMap
  id: StarlightOrwell
  mapName: 'Orwell "Citadel" Station'
  mapPath: /Maps/_Starlight/Stations/Orwell.yml
  minPlayers: 50
  maxPlayers: 350
  stations:
    StarlightOrwell:
      stationProto: StandardNanotrasenStation
      components:
        - type: StationNameSetup
          mapNameTemplate: '{0} Orwell "Citadel" Station {1}'
          nameGenerator:
            !type:NanotrasenNameGenerator
            prefixCreator: 'GO'
        - type: StationEmergencyShuttle
          emergencyShuttlePath: /Maps/_Starlight/Shuttles/Evac/emergency_delta.yml
        - type: StationJobs
          availableJobs:
            #service
            HeadOfPersonnel: [ 1, 1 ]
            Bartender: [ 3, 3 ]
            Botanist: [ 3, 3 ]
            Chef: [ 2, 2 ]
            ServiceWorker: [ 4, 4 ]
            #engineering
            StationEngineer: [ 5, 5 ]
            TechnicalAssistant: [ 4, 4 ]
            #medical
            MedicalDoctor: [ 8, 8 ]
            Paramedic: [ 2, 2 ]
            MedicalIntern: [ 4, 4 ]
            #science
            Scientist: [ 5, 5 ]
            ResearchAssistant: [ 4, 4 ]
            #security
            HeadOfSecurity: [ 1, 1 ]
            Warden: [ 1, 1 ]
            SecurityOfficer: [ 12, 12 ]
            SeniorOfficer: [ 1, 1 ] # Serenity
            SecurityCadet: [ 6, 6 ]
            Brigmedic: [ 2, 2 ]
            #supply
            MailTech: [ 2, 2 ]
            #civilian
            Assistant: [ -1, -1 ]
            AssistantManager: [ 2, 2 ]
            RadioHost: [ 2, 2 ]
            #silicon
            Borg: [ 5, 5 ]
            #law
            #Representatives

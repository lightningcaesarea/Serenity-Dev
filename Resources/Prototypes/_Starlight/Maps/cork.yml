- type: gameMap
  id: StarlightCork
  mapName: 'Cork Outpost'
  mapPath: /Maps/_Starlight/Stations/Cork.yml
  maxRandomOffset: 0
  randomRotation: false
  minPlayers: 0
  maxPlayers: 15
  stations:
    StarlightCork:
      stationProto: StandardNanotrasenStation
      components:
        - type: StationNameSetup
          mapNameTemplate: '{0} Cork {1}'
          nameGenerator:
            !type:NanotrasenNameGenerator
            prefixCreator: 'VLP'
        - type: StationJobs
          availableJobs:
            # Service
            HeadOfPersonnel: [ 1, 1 ]
            Bartender: [ 1, 1 ]
            Botanist: [ 2, 2 ]
            Chef: [ 1, 1 ]
            RadioHost: [ 1, 1 ]
            ServiceWorker: [ 3, 3 ]

            # Cargo
            MailTech: [ 1, 1 ]

            # ITG

            # Engineering
            StationEngineer: [ 2, 2 ]
            TechnicalAssistant: [ 2, 2 ]

            # Medical
            MedicalDoctor: [ 4, 4 ]
            MedicalIntern: [ 2, 2 ]
            Paramedic: [ 1, 1 ]

            # Science
            Scientist: [ 3, 3 ]
            ResearchAssistant: [ 2, 2 ]

            # Security
            HeadOfSecurity: [ 1, 1 ]
            Warden: [ 1, 1 ]
            SecurityOfficer: [ 2, 3 ]
            SeniorOfficer: [ 1, 1 ] # Serenity
            SecurityCadet: [ 2, 2 ]
            Brigmedic: [ 1, 1 ]
            #K9: [ 1, 1 ]

            # Civilian
            AssistantManager: [ 1, 1 ]
            Assistant: [ -1, -1 ]

            # Silicon
            Borg: [ 2, 2 ]

            # Representatives

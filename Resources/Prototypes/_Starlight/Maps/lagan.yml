- type: gameMap
  id: StarlightLagan
  mapName: 'Lagan'
  mapPath: /Maps/_Starlight/Stations/Lagan.yml
  minPlayers: 50
  maxPlayers: 350
  stations:
    StarlightLagan:
      stationProto: StandardNanotrasenStation
      components:
        - type: StationNameSetup
          mapNameTemplate: '{0} Lagan {1}'
          nameGenerator:
            !type:NanotrasenNameGenerator
            prefixCreator: '14'
        - type: StationEmergencyShuttle
          emergencyShuttlePath: /Maps/_Starlight/Shuttles/Evac/emergency_raven.yml
        - type: StationJobs
          availableJobs:
            # Service
            HeadOfPersonnel: [ 1, 1 ]

            Bartender: [ 3, 3 ]
            Botanist: [ 3, 3 ]
            Chef: [ 3, 3 ]
            RadioHost: [ 2, 2 ]
            ServiceWorker: [ 7, 7 ]


            # Engineering
            StationEngineer: [ 6, 6 ]
            TechnicalAssistant: [ 3, 3 ]

            # Medical
            Paramedic: [ 2, 2 ]
            MedicalDoctor: [ 11, 11 ]
            MedicalIntern: [ 4, 4 ]

            # Science
            Scientist: [ 7, 7 ]
            ResearchAssistant: [ 4, 4 ]

            # Security
            HeadOfSecurity: [ 1, 1 ]
            Warden: [ 1, 1 ]
            Brigmedic: [ 2, 2 ]
            SecurityOfficer: [ 12, 12 ]
            SeniorOfficer: [ 1, 1 ] # Serenity
            SecurityCadet: [ 6, 6 ]

            # Cargo
            MailTech: [ 2, 2 ]

            # Civilian
            AssistantManager: [ 2, 2 ]
            Assistant: [ -1, -1 ]

            # Silicon
            Borg: [ 4, 4 ]

            # Representatives

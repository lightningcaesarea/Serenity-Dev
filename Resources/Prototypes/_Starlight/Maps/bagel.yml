            #engineering
            StationEngineer: [ 4, 4 ]
            TechnicalAssistant: [ 4, 4 ]
            #medical
            MedicalDoctor: [ 5, 5 ]
            Paramedic: [ 1, 1 ]
            MedicalIntern: [ 4, 4 ]
            #science
            Scientist: [ 5, 5 ]
            ResearchAssistant: [ 4, 4 ]
            #security
            Warden: [ 1, 1 ]
            SecurityOfficer: [ 6, 8 ]
            SeniorOfficer: [ 1, 1 ] # Serenity
            SecurityCadet: [ 3, 4 ]
            Brigmedic: [ 1, 1 ]
            #supply
            SalvageLead: [ 1, 1 ]
            SalvageMedic: [ 1, 1 ]

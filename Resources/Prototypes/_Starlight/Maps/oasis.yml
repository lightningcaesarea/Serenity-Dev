- type: gameMap
  id: StarlightOasis
  mapName: 'Oasis'
  mapPath: /Maps/_Starlight/Stations/Oasis.yml
  minPlayers: 50
  maxPlayers: 150
  stations:
    StarlightOasis:
      stationProto: StandardNanotrasenStation
      components:
        - type: StationNameSetup
          mapNameTemplate: '{0} Oasis {1}'
          nameGenerator:
            !type:NanotrasenNameGenerator
            prefixCreator: 'B'
        - type: StationEmergencyShuttle
          emergencyShuttlePath: /Maps/Shuttles/emergency_accordia.yml
        - type: StationJobs
          availableJobs:
            #service
            HeadOfPersonnel: [ 1, 1 ]
            Bartender: [ 2, 2 ]
            Botanist: [ 2, 2 ]
            Chef: [ 2, 2 ]
            ServiceWorker: [ 3, 3 ]
            RadioHost: [ 2, 2 ]
            #engineering
            StationEngineer: [ 6, 6 ]
            TechnicalAssistant: [ 4, 4 ]
            #medical
            MedicalDoctor: [ 9, 9 ]
            Paramedic: [ 2, 2 ]
            MedicalIntern: [ 4, 4 ]
            #science
            Scientist: [ 6, 6 ]
            ResearchAssistant: [ 5, 5 ]
            #security
            HeadOfSecurity: [ 1, 1 ]
            Warden: [ 1, 1 ]
            SecurityOfficer: [ 6, 8 ]
            SeniorOfficer: [ 1, 1 ] # Serenity
            SecurityCadet: [ 3, 4 ]
            Brigmedic: [ 1, 1 ]
            #supply
            MailTech: [ 1, 2 ]
            #civilian
            Assistant: [ -1, -1 ]
            AssistantManager: [ 2, 2 ]
            #silicon
            Borg: [ 3, 4 ]
            #law
            #Representatives

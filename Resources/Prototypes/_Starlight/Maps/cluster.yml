- type: gameMap
  id: StarlightCluster
  mapName: 'Cluster'
  mapPath: /Maps/_Starlight/Stations/Cluster.yml
  minPlayers: 0
  maxPlayers: 35
  stations:
    StarlightCluster:
      stationProto: StandardNanotrasenStation
      components:
        - type: StationNameSetup
          mapNameTemplate: '{0} Cluster Station {1}'
          nameGenerator:
            !type:NanotrasenNameGenerator
            prefixCreator: 'CW'
        - type: StationEmergencyShuttle
          emergencyShuttlePath: /Maps/_Starlight/Shuttles/Evac/emergency_cluster.yml
        - type: StationJobs
          availableJobs:
            # Service
            HeadOfPersonnel: [ 1, 1 ]

            Bartender: [ 1, 2 ]
            Botanist: [ 1, 1 ]
            Chef: [ 1, 1 ]
            RadioHost: [ 1, 1 ]
            ServiceWorker: [ 2, 2 ]

            # Engineering
            StationEngineer: [ 3, 3 ]
            TechnicalAssistant: [ 2, 2 ]

            # Medical
            MedicalDoctor: [ 5, 5 ]
            Paramedic: [ 1, 1 ]
            MedicalIntern: [ 2, 2 ]

            # Science
            Scientist: [ 3, 3 ]
            ResearchAssistant: [ 2, 2 ]

            # Security
            HeadOfSecurity: [ 1, 1 ]
            Warden: [ 1, 1 ]
            Brigmedic: [ 1, 1 ]
            #K9: [ 1, 1 ]
            SecurityOfficer: [ 3, 3 ]
            SeniorOfficer: [ 1, 1 ] # Serenity
            SecurityCadet: [ 2, 2 ]

            # Supply
            SalvageLead: [ 1, 1 ]
            SalvageMedic: [ 1, 1 ]
            MiningSpecialist: [ 2, 2 ]
            MailTech: [ 1, 1 ]

            # Civilian
            AssistantManager: [ 1, 1 ]
            Assistant: [ -1, -1 ]

            # Silicon
            Borg: [ 2, 2 ]

            # Representatives

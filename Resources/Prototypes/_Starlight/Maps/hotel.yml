- type: gameMap
  id: StarlightHotel
  mapName: 'Hotel'
  mapPath: /Maps/_Starlight/Stations/Hotel.yml
  minPlayers: 7
  maxPlayers: 55
  stations:
    StarlightHotel:
      stationProto: StandardNanotrasenStation
      components:
        - type: StationNameSetup
          mapNameTemplate: '{0} Hotel {1}'
          nameGenerator:
            !type:NanotrasenNameGenerator
            prefixCreator: '14'
        - type: StationEmergencyShuttle
          emergencyShuttlePath: /Maps/_Starlight/Shuttles/Evac/emergency_hotel.yml
        - type: StationJobs
          availableJobs:
            #service
            HeadOfPersonnel: [ 1, 1 ]
            Bartender: [ 2, 2 ]
            Botanist: [ 2, 2 ]
            Chef: [ 2, 2 ]
            ServiceWorker: [ 2, 4 ]
            #engineering
            StationEngineer: [ 4, 6 ]
            TechnicalAssistant: [ 3, 5 ]
            #medical
            MedicalDoctor: [ 6, 8 ]
            MedicalIntern: [ 3, 6 ]
            Paramedic: [ 2, 2 ]
            #science
            Scientist: [ 3, 6 ]
            ResearchAssistant: [ 3, 5 ]
            #security
            HeadOfSecurity: [ 1, 1 ]
            Warden: [ 1, 1 ]
            SecurityOfficer: [ 4, 6 ]
            SeniorOfficer: [ 1, 1 ] # Serenity
            SecurityCadet: [ 2, 3 ]
            Brigmedic: [ 1, 1 ]
            #supply
            MailTech: [ 1, 2 ]
            #civilian
            AssistantManager: [ 1, 1 ]
            Assistant: [ -1, -1 ]
            RadioHost: [ 1, 1 ]
            #silicon
            Borg: [ 3, 6 ]
            #law
            #Representatives

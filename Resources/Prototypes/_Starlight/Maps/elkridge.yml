- type: gameMap
  id: StarlightElkridge
  mapName: 'Elkridge Depot'
  mapPath: /Maps/_Starlight/Stations/Elkridge.yml
  minPlayers: 15
  maxPlayers: 75
  stations:
    StarlightElkridge:
      stationProto: StandardNanotrasenStation
      components:
        - type: StationNameSetup
          mapNameTemplate: '{0} Elkridge Depot {1}'
          nameGenerator:
            !type:NanotrasenNameGenerator
            prefixCreator: 'DS'
        - type: StationEmergencyShuttle
          emergencyShuttlePath: /Maps/Shuttles/emergency_elkridge.yml
        - type: StationCargoShuttle
          path: /Maps/Shuttles/cargo_elkridge.yml
        - type: StationJobs
          availableJobs:
            #service
            HeadOfPersonnel: [ 1, 1 ]
            Bartender: [ 2, 2 ]
            Botanist: [ 1, 2 ]
            Chef: [ 2, 2 ]
            ServiceWorker: [ 2, 2 ]
            #engineering
            StationEngineer: [ 4, 5 ]
            TechnicalAssistant: [ 2, 2 ]
            #medical
            MedicalDoctor: [ 6, 7 ]
            MedicalIntern: [ 2, 2 ]
            Paramedic: [ 2, 2 ]
            #science
            Scientist: [ 3, 4 ]
            ResearchAssistant: [ 2, 2 ]
            #security
            HeadOfSecurity: [ 1, 1 ]
            Warden: [ 1, 1 ]
            SecurityOfficer: [ 4, 6 ]
            SeniorOfficer: [ 1, 1 ] # Serenity
            SecurityCadet: [ 2, 3 ]
            Brigmedic: [ 1, 1 ]
            #supply
            MailTech: [ 1, 2 ]
            #civilian
            Assistant: [ -1, -1 ]
            AssistantManager: [ 1, 1 ]
            RadioHost: [ 1, 1 ]
            #silicon
            Borg: [ 2, 3 ]
            #law
            #Representatives

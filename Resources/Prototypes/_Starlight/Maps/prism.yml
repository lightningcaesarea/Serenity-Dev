- type: gameMap
  id: StarlightPrism
  mapName: 'Prism Station'
  mapPath: /Maps/_Starlight/Stations/Prism.yml
  minPlayers: 25
  maxPlayers: 80
  stations:
    StarlightPrism:
      stationProto: StandardNanotrasenStation
      components:
        - type: StationNameSetup
          mapNameTemplate: '{0} Prism Station {1}'
          nameGenerator:
            !type:NanotrasenNameGenerator
            prefixCreator: 'SR'
        - type: StationEmergencyShuttle
          emergencyShuttlePath: /Maps/_Starlight/Shuttles/Evac/emergency_prism.yml
        - type: StationCargoShuttle
          path: /Maps/_Starlight/Shuttles/Cargo/cargo_prism.yml
        - type: StationJobs
          availableJobs:
            #command
            HeadOfPersonnel: [ 1, 1 ]
            HeadOfSecurity: [ 1, 1 ]
            #service
            Bartender: [ 1, 2]
            Botanist: [ 1, 2 ]
            Chef: [ 1, 2 ]
            ServiceWorker: [ 5, 5 ]
            #engineering
            StationEngineer: [ 4, 4 ]
            TechnicalAssistant: [ 2, 3 ]
            #medical
            MedicalDoctor: [ 6, 6 ]
            MedicalIntern: [ 3, 4 ]
            Paramedic: [ 2, 2 ]
            #science
            Scientist: [ 3, 4 ]
            ResearchAssistant: [ 2, 3 ]
            #security
            Warden: [ 1, 1 ]
            SecurityOfficer: [ 4, 6 ]
            SeniorOfficer: [ 1, 1 ] # Serenity
            SecurityCadet: [ 2, 3 ]
            Brigmedic: [ 1, 1 ]
            #supply
            SalvageLead: [ 1, 1 ]
            SalvageMedic: [ 1, 1 ]
            MiningSpecialist: [ 3, 3 ]
            MailTech: [ 2, 2 ]
            #civilian
            Assistant: [ -1, -1 ]
            AssistantManager: [ 1, 1 ]
            RadioHost: [ 1, 1 ]
            #silicon (3)
            Borg: [ 4, 4 ]
            #law
            #Representatives

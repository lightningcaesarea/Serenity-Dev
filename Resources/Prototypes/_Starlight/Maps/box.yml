- type: gameMap
  id: StarlightBox
  mapName: 'Box Station'
  mapPath: /Maps/_Starlight/Stations/Box.yml
  minPlayers: 50
  maxPlayers: 120
  stations:
    StarlightBox:
      stationProto: StandardNanotrasenStation
      components:
        - type: StationNameSetup
          mapNameTemplate: '{0} Box Station {1}'
          nameGenerator:
            !type:NanotrasenNameGenerator
            prefixCreator: 'TG'
        - type: StationEmergencyShuttle
          emergencyShuttlePath: /Maps/Shuttles/emergency_box.yml
        - type: StationJobs
          availableJobs:
            #service
            HeadOfPersonnel: [ 1, 1 ]
            Bartender: [ 2, 2 ]
            Botanist: [ 3, 3 ]
            Chef: [ 2, 2 ]
            ServiceWorker: [ 2, 3 ]
            RadioHost: [ 2, 2 ]
            #engineering
            StationEngineer: [ 5, 5 ]
            TechnicalAssistant: [ 4, 4 ]
            #medical
            MedicalDoctor: [ 6, 7 ]
            Paramedic: [ 1, 1 ]
            MedicalIntern: [ 4, 4 ]
            #science
            Scientist: [ 5, 5 ]
            ResearchAssistant: [ 4, 4 ]
            #security
            HeadOfSecurity: [ 1, 1 ]
            Warden: [ 1, 1 ]
            SecurityOfficer: [ 6, 8 ]
            SeniorOfficer: [ 1, 1 ] # Serenity
            SecurityCadet: [ 3, 4 ]
            Brigmedic: [ 1, 1 ]
            #supply
            MailTech: [ 1, 2 ]
            #civilian
            AssistantManager: [ 1, 1 ]
            Assistant: [ -1, -1 ]
            #silicon
            Borg: [ 3, 4 ]
            #law
            #Representatives


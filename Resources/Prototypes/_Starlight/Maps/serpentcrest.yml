- type: gameMap
  id: StarlightSerpentcrest
  mapName: 'Serpentcrest'
  mapPath: /Maps/_Starlight/Stations/Serpentcrest.yml
  minPlayers: 50
  maxPlayers: 350
  stations:
    StarlightSerpentcrest:
      stationProto: StandardNanotrasenStation
      components:
        - type: StationNameSetup
          mapNameTemplate: '{0} Serpentcrest {1}'
          nameGenerator:
            !type:NanotrasenNameGenerator
            prefixCreator: 'B'
        - type: StationEmergencyShuttle
          emergencyShuttlePath: /Maps/_Starlight/Shuttles/Evac/emergency_syndicate.yml
        - type: StationCargoShuttle
          path: /Maps/_Starlight/Shuttles/Cargo/cargo_syndicate.yml
        - type: StationJobs
          availableJobs:
            # Command
            HeadOfPersonnel: [ 1, 1 ]
            HeadOfSecurity: [ 1, 1 ]

            # Service
            Bartender: [ 2, 2 ]
            Botanist: [ 3, 3 ]
            Chef: [ 2, 2 ]
            ServiceWorker: [ 4, 4 ]

            RadioHost: [ 2, 2 ]


            # Engineering
            StationEngineer: [ 6, 6 ]
            TechnicalAssistant: [ 4, 4 ]

            # Medical
            MedicalDoctor: [ 9, 9 ] # Serenity: includes the retired Chemist slots
            Paramedic: [ 2, 2 ]
            MedicalIntern: [ 4, 4 ]

            # Science
            Scientist: [ 7, 7 ]
            ResearchAssistant: [ 4, 4 ]

            # Security
            Warden: [ 1, 1 ]
            SecurityOfficer: [ 10, 12 ]
            SeniorOfficer: [ 1, 1 ] # Serenity
            Brigmedic: [ 2, 2 ]
            SecurityCadet: [ 4, 4 ]

            # Supply
            MailTech: [ 2, 2 ]
            MiningSpecialist: [ 4, 4 ]

            # ITG
            SalvageLead: [ 1, 1 ]
            SalvageMedic: [ 1, 1 ]

            # Civilian
            AssistantManager: [ 2, 2 ]
            Assistant: [ -1, -1 ]

            # Silicon
            Borg: [ 5, 5 ]

            # Representatives

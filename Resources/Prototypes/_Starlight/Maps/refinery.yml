- type: gameMap
  id: StarlightRefinery
  mapName: 'Refinery Starport'
  mapPath: /Maps/_Starlight/Stations/Refinery.yml
  minPlayers: 100
  maxPlayers: 350
  stations:
    StarlightRefinery:
      stationProto: StandardNanotrasenStation
      components:
        - type: StationNameSetup
          mapNameTemplate: '{0} Refinery {1}'
          nameGenerator:
            !type:NanotrasenNameGenerator
            prefixCreator: 'RF'
        - type: StationEmergencyShuttle
          emergencyShuttlePath: /Maps/_Starlight/Shuttles/Evac/emergency_spacemall.yml
        - type: StationJobs
          availableJobs:
            #service
            HeadOfPersonnel: [ 1, 1 ]
            Bartender: [ 3, 3 ]
            Botanist: [ 4, 4 ]
            Chef: [ 3, 3 ]
            ServiceWorker: [ 5, 5 ]
            RadioHost: [ 2, 2 ]
            #engineering
            StationEngineer: [ 6, 6 ]
            TechnicalAssistant: [ 4, 4 ]
            #medical
            MedicalDoctor: [ 9, 9 ]
            Paramedic: [ 3, 3 ]
            MedicalIntern: [ 3, 3 ]
            #science
            Scientist: [ 6, 6 ]
            ResearchAssistant: [ 4, 4 ]
            #security
            HeadOfSecurity: [ 1, 1 ]
            Warden: [ 1, 1 ]
            SecurityOfficer: [ 12, 12 ]
            SeniorOfficer: [ 1, 1 ] # Serenity
            SecurityCadet: [ 6, 6 ]
            Brigmedic: [ 2, 2 ]
            #supply
            MailTech: [ 3, 3 ]
            #salvage
            #civilian
            Assistant: [ -1, -1 ]
            AssistantManager: [ 2, 2 ]
            #silicon
            Borg: [ 5, 5 ]
            #law
            #Representatives

- type: gameMap
  id: StarlightNovoLobster
  mapName: 'Novo Lobster'
  mapPath: /Maps/_Starlight/Stations/NovoLobster.yml
  minPlayers: 40
  maxPlayers: 350
  randomRotation: false # random rotation looks weird with weather
  stations:
    StarlightNovoLobster:
      stationProto: StandardNanotrasenStation
      components:
        - type: StationNameSetup
          mapNameTemplate: 'Novo Lobster {0} {1}'
          nameGenerator:
            !type:NanotrasenNameGenerator
            prefixCreator: 'CW'
        - type: StationEmergencyShuttle
          emergencyShuttlePath: /Maps/_Starlight/Shuttles/Evac/emergency_silica.yml
        - type: StationCargoShuttle
          path: /Maps/_Starlight/Shuttles/Cargo/cargo_novolobster.yml
        - type: StationJobs
          availableJobs:
            # Service
            HeadOfPersonnel: [ 1, 1 ]

            Bartender: [ 3, 3 ]
            Botanist: [ 3, 3 ]
            Chef: [ 3, 3 ]
            ServiceWorker: [ 5, 5 ]

            RadioHost: [ 2, 2 ]


            # Engineering
            StationEngineer: [ 7, 7 ]
            TechnicalAssistant: [ 5, 5 ]

            # Medical
            MedicalDoctor: [ 11, 11 ] # Serenity: includes the retired Chemist slots
            MedicalIntern: [ 4, 4 ]
            Paramedic: [ 2, 2 ]

            # Science
            Scientist: [ 6, 6 ]
            ResearchAssistant: [ 4, 4 ]

            # Security
            HeadOfSecurity: [ 1, 1 ]
            Warden: [ 1, 1 ]
            SecurityOfficer: [ 12, 12 ]
            SeniorOfficer: [ 1, 1 ] # Serenity
            Brigmedic: [ 2, 2 ]
            SecurityCadet: [ 6, 6 ]

            # Supply
            MiningSpecialist: [ 4, 4 ]
            MailTech: [ 2, 2 ]

            # ITG
            SalvageLead: [ 1, 1 ]
            SalvageMedic: [ 1, 1 ]

            # Civilian
            Assistant: [ -1, -1 ]
            AssistantManager: [ 2, 2 ]

            # Silicon
            Borg: [ 4, 4 ]

            # Representatives

- type: gameMap
  id: StarlightReach
  mapName: 'Reach'
  mapPath: /Maps/_Starlight/Stations/Reach.yml
  minPlayers: 0
  maxPlayers: 15
  stations:
    StarlightReach:
      stationProto: StandardNanotrasenStation
      components:
        - type: StationNameSetup
          mapNameTemplate: '{0} Reach Transport {1}'
          nameGenerator:
            !type:NanotrasenNameGenerator
            prefixCreator: 'RT'
        - type: StationEmergencyShuttle
          emergencyShuttlePath: /Maps/Shuttles/emergency.yml
        - type: StationJobs
          availableJobs:
            #service
            HeadOfPersonnel: [ 1, 1 ]
            Bartender: [ 1, 1 ]
            Botanist: [ 1, 1 ]
            Chef: [ 1, 1 ]
            ServiceWorker: [ 1, 1 ]
            #engineering
            StationEngineer: [ 1, 2 ]
            TechnicalAssistant: [ 1, 1 ]
            #medical
            MedicalDoctor: [ 2, 3 ]
            MedicalIntern: [ 1, 1 ]
            Paramedic: [ 1, 1 ]
            #science
            Scientist: [ 1, 1 ]
            ResearchAssistant: [ 1, 1 ]
            #security
            HeadOfSecurity: [ 1, 1 ]
            Warden: [ 1, 1 ]
            Brigmedic: [ 1, 1 ]
            SecurityOfficer: [ 2, 3 ]
            SeniorOfficer: [ 1, 1 ] # Serenity
            SecurityCadet: [ 2, 2 ]
            #supply
            SalvageLead: [ 1, 1 ]
            SalvageMedic: [ 1, 1 ]
            MiningSpecialist: [ 1, 2 ]
            MailTech: [ 1, 1 ]
            #civilian
            Assistant: [ -1, -1 ]
            AssistantManager: [ 1, 1 ]
            #silicon
            Borg: [ 1, 2 ]
            #law
            #Representatives

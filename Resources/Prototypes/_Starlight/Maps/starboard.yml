- type: gameMap
  id: StarlightStarboard
  mapName: 'Starboard'
  mapPath: /Maps/_Starlight/Stations/Starboard.yml
  minPlayers: 90
  maxPlayers: 500
  stations:
    StarlightStarboard:
      stationProto: StandardNanotrasenStation
      components:
        - type: StationNameSetup
          mapNameTemplate: '{0} Starboard Depot {1}'
          nameGenerator:
            !type:NanotrasenNameGenerator
            prefixCreator: 'DS'
        - type: StationEmergencyShuttle
          emergencyShuttlePath: /Maps/_Starlight/Shuttles/Evac/emergency_starboard.yml
        - type: StationJobs
          availableJobs:
            #service
            HeadOfPersonnel: [ 1, 1 ]
            Bartender: [ 3, 3 ]
            Botanist: [ 3, 3 ]
            Chef: [ 3, 3 ]
            ServiceWorker: [ 5, 5 ]
            RadioHost: [ 2, 2 ]
            #engineering
            StationEngineer: [ 6, 6 ]
            TechnicalAssistant: [ 4, 4 ]
            #medical
            MedicalDoctor: [ 10, 10 ]
            MedicalIntern: [ 4, 4 ]
            Paramedic: [ 2, 2 ]
            #science
            Scientist: [ 7, 7 ]
            ResearchAssistant: [ 4, 4 ]
            #security
            HeadOfSecurity: [ 1, 1 ]
            Warden: [ 1, 1 ]
            SecurityOfficer: [ 12, 12 ]
            SeniorOfficer: [ 1, 1 ] # Serenity
            SecurityCadet: [ 6, 6 ]
            Brigmedic: [ 2, 2 ]
            #supply
            SalvageLead: [ 1, 1 ]
            SalvageMedic: [ 1, 1 ]
            MiningSpecialist: [ 4, 4 ]
            MailTech: [ 3, 3 ]
            #civillian
            Assistant: [ -1, -1 ]
            #silicon
            Borg: [ 4, 4 ]
            #law
            #Representatives

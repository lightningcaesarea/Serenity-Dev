- type: job
  id: Assistant
  name: job-name-assistant
  description: job-description-assistant
  playTimeTracker: JobPassenger
  startingGear: AssistantGear
  icon: "JobIconAssistant"
  supervisors: job-supervisors-assistantmanager # Starlight
  access:
  - Maintenance
  special:
  - !type:AddImplantSpecial
    implants: [ MedicalRecoveryImplant ]

- type: job # Just ignore it. It’s a database workaround.
  id: Passenger
  overrideConsoleVisibility: false # SL - don't show in ID console
  hidden: true
  name: job-name-assistant
  description: job-description-assistant
  playTimeTracker: JobAssistant
  startingGear: AssistantGear
  icon: "JobIconAssistant"
  supervisors: job-supervisors-everyone
  access:
  - Maintenance
  special:
  - !type:AddImplantSpecial
    implants: [ MedicalRecoveryImplant ]

- type: startingGear
  id: AssistantGear
  equipment:
    id: AssistantPDA
    ears: ClothingHeadsetAssistant
    belt: JetpackMiniFilled # Serenity start: Spacers get pilot-style EVA kit
  inhand:
  - ClothingOuterHardsuitEVA
  storage:
    back:
    - ClothingHeadHelmetEVA # Serenity end

- type: chameleonOutfit
  id: PassengerChameleonOutfit
  job: Passenger
  equipment:
    head: ClothingHeadHatWelding
    eyes: ClothingEyesGlassesCheapSunglasses
    mask: ClothingMaskGas
    neck: ClothingNeckMantle
    outerClothing: ClothingOuterWinterCoat
    gloves: ClothingHandsGlovesColorYellowBudget

- type: job
  id: HeadOfPersonnel
  name: job-name-station-commander # Serenity: reworked into the Station Commander, the top of the Outpost's chain of command
  description: job-description-station-commander # Serenity
  playTimeTracker: JobHeadOfPersonnel
  requirements:
    # Serenity: the old Botanist/Chef/Janitor gates can't be earned on the Outpost, so the Commander gates on overall playtime
    - !type:OverallPlaytimeRequirement
      time: 20h
    - !type:TraitsRequirement # Starlight
      traits:
        - Iterator
      inverted: true
  weight: 20
  startingGear: HoPGear
  icon: "JobIconHeadOfPersonnel"
  joinNotifyCrew: true # Serenity
  supervisors: job-supervisors-centcom # Serenity
  # Serenity: the Station Commander runs the whole station, so they get all station access like the Captain
  accessGroups:
  - AllAccess
  special:
  - !type:AddImplantSpecial
    implants: [ MindShieldImplant ]
  - !type:AddComponentSpecial
    components:
      - type: CommandStaff

- type: startingGear
  id: HoPGear
  equipment:
    #shoes: ClothingShoesColorBrown # 🌟Starlight🌟
    id: HoPPDA
    gloves: ClothingHandsGlovesStationCommander
    ears: ClothingHeadsetStationCommander
    belt: BoxFolderClipboardThreePapers
    #eyes: ClothingEyesHudCommand #Starlight
  storage:
    back:
    - Flash

- type: chameleonOutfit
  id: HeadOfPersonnelChameleonOutfit
  job: HeadOfPersonnel
  hasMindShield: true
  equipment:
    head: ClothingHeadHatStationCommanderCap
    eyes: ClothingEyesHudCommand
    mask: ClothingMaskNeckGaiterRed
    neck: ClothingNeckCloakStationCommander
    outerClothing: ClothingOuterWinterStationCommander

